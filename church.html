<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />

    <title>Quiet America · The Little Chapel</title>
    <style>
      :root {
        --bg: #faf6ec;
        --bg-soft: #f3ecdb;
        --card: #fffdf6;
        --ink: #2f2a21;
        --ink-soft: #6d6353;
        --line: #ddd2ba;
        --wood: #8a6844;
        --wood-deep: #6d4f30;
        --gold: #b98a2f;
        --accent-soft: #efe3c8;
        --chip-bg: rgba(255, 253, 246, 0.88);
        --shadow: 0 10px 30px rgba(80, 62, 32, 0.14);
        --radius: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17140f;
          --bg-soft: #201b14;
          --card: #221d15;
          --ink: #ece4d2;
          --ink-soft: #b3a78f;
          --line: #3d3527;
          --wood: #c49a68;
          --wood-deep: #a87f4f;
          --gold: #d9ab4e;
          --accent-soft: #2e2718;
          --chip-bg: rgba(28, 24, 17, 0.88);
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 14px 14px 30px;
      }
      /* ---------- Scene ---------- */
      .scene-box {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 4.6;
        max-height: 62vh;
        border-radius: 18px;
        overflow: hidden;
        background: #efe6d0;
        box-shadow: var(--shadow);
      }
      @media (min-width: 700px) {
        .scene-box { aspect-ratio: 16 / 11; max-height: 66vh; }
      }
      .scene-box canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: manipulation;
      }
      .scene-chips {
        position: absolute;
        top: 10px;
        right: 10px;
        display: flex;
        gap: 8px;
        z-index: 5;
      }
      .chip {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--chip-bg);
        color: var(--ink);
        font-size: 13px;
        line-height: 1;
        padding: 8px 12px;
        border-radius: 999px;
        cursor: pointer;
        backdrop-filter: blur(4px);
      }
      .chip[aria-pressed="true"] {
        background: var(--wood);
        border-color: var(--wood);
        color: #fff8ea;
      }
      .scene-hint {
        position: absolute;
        left: 10px;
        bottom: 10px;
        z-index: 5;
        font-size: 12px;
        color: #5d5340;
        background: rgba(255, 251, 240, 0.78);
        padding: 5px 10px;
        border-radius: 999px;
        pointer-events: none;
      }
      @media (prefers-color-scheme: dark) {
        .scene-hint { color: #e6dcc4; background: rgba(24, 20, 14, 0.72); }
      }
      /* ---------- Intro / count ---------- */
      .intro {
        text-align: center;
        margin: 18px 6px 4px;
        font-family: Georgia, "Times New Roman", "Songti SC", "STSong", serif;
        font-size: 19px;
        line-height: 1.55;
      }
      .count-line {
        text-align: center;
        color: var(--ink-soft);
        font-size: 13.5px;
        margin: 6px 0 2px;
      }
      .count-line b { color: var(--wood-deep); font-weight: 600; }
      @media (prefers-color-scheme: dark) { .count-line b { color: var(--gold); } }
      /* ---------- Actions ---------- */
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 16px;
      }
      .action {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        border-radius: var(--radius);
        padding: 16px 12px 14px;
        cursor: pointer;
        text-align: center;
        font-family: inherit;
        transition: border-color 0.2s ease, background 0.2s ease;
      }
      .action:hover { border-color: var(--wood); }
      .action[aria-pressed="true"] {
        background: var(--accent-soft);
        border-color: var(--wood);
      }
      .action .a-icon {
        display: block;
        width: 26px; height: 26px;
        margin: 0 auto 8px;
        color: var(--wood);
      }
      .action .a-label { display: block; font-size: 15.5px; font-weight: 600; }
      .action .a-sub { display: block; font-size: 12px; color: var(--ink-soft); margin-top: 3px; line-height: 1.45; }
      /* ---------- Panels ---------- */
      .panel {
        margin-top: 14px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 18px 16px;
        box-shadow: var(--shadow);
      }
      .panel[hidden] { display: none; }
      /* Breathing */
      .breath-wrap { text-align: center; }
      .breath-ring {
        width: 132px; height: 132px;
        margin: 4px auto 10px;
        border-radius: 50%;
        border: 2px solid var(--line);
        display: flex; align-items: center; justify-content: center;
        position: relative;
      }
      .breath-core {
        width: 74px; height: 74px;
        border-radius: 50%;
        background: radial-gradient(circle at 42% 38%, #f3d489, #c99b3f 78%);
        transform: scale(0.72);
        will-change: transform;
      }
      .breath-word { font-size: 15px; color: var(--ink-soft); min-height: 22px; }
      .breath-timer {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 26px;
        margin-top: 2px;
        font-variant-numeric: tabular-nums;
      }
      /* Verse */
      .verse-card { text-align: center; }
      .verse-text {
        font-family: Georgia, "Times New Roman", "Songti SC", "STSong", serif;
        font-size: 19px;
        line-height: 1.75;
        margin: 2px 4px 10px;
      }
      .verse-ref { color: var(--wood-deep); font-size: 14px; letter-spacing: 0.02em; }
      @media (prefers-color-scheme: dark) { .verse-ref { color: var(--gold); } }
      /* Candle form */
      .field { margin-bottom: 12px; }
      .field label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 5px; }
      .field input {
        width: 100%;
        font: inherit;
        font-size: 16px;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg);
        color: var(--ink);
      }
      .field input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
      .char-n { float: right; font-size: 11.5px; color: var(--ink-soft); }
      .primary-btn {
        appearance: none;
        width: 100%;
        border: none;
        background: var(--wood);
        color: #fff8ea;
        font: inherit;
        font-size: 15.5px;
        font-weight: 600;
        padding: 13px;
        border-radius: 10px;
        cursor: pointer;
      }
      .primary-btn:disabled { opacity: 0.55; cursor: default; }
      .form-note { font-size: 13.5px; line-height: 1.6; margin: 10px 2px 0; min-height: 20px; }
      .form-note.ok { color: var(--wood-deep); }
      @media (prefers-color-scheme: dark) { .form-note.ok { color: var(--gold); } }
      /* Reading card */
      .read-card { text-align: center; }
      .read-flame { font-size: 22px; line-height: 1; }
      .read-line {
        font-family: Georgia, "Times New Roman", "Songti SC", "STSong", serif;
        font-size: 17.5px;
        line-height: 1.7;
        margin: 8px 4px 6px;
        overflow-wrap: anywhere;
      }
      .read-name { color: var(--ink-soft); font-size: 13.5px; }
      .quiet-btn {
        appearance: none;
        margin-top: 12px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink-soft);
        font: inherit;
        font-size: 13.5px;
        padding: 8px 18px;
        border-radius: 999px;
        cursor: pointer;
      }
      /* Stand list */
      .stand-list { margin-top: 20px; }
      .stand-title {
        font-size: 13px;
        color: var(--ink-soft);
        text-align: center;
        margin-bottom: 10px;
      }
      .stand-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }
      .candle-chip {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        padding: 7px 12px 7px 9px;
        border-radius: 999px;
        cursor: pointer;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .candle-chip .dot {
        display: inline-block;
        width: 7px; height: 7px;
        border-radius: 50%;
        background: var(--gold);
        margin-right: 7px;
        box-shadow: 0 0 6px 1px rgba(201, 155, 63, 0.65);
        vertical-align: 1px;
      }
      .stand-empty {
        text-align: center;
        color: var(--ink-soft);
        font-size: 13.5px;
        line-height: 1.7;
      }
      /* Footer */
      footer {
        margin-top: 30px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        text-align: center;
        color: var(--ink-soft);
      }
      footer .f-brand { font-size: 13px; letter-spacing: 0.03em; }
      footer .f-line { font-size: 12.5px; line-height: 1.7; margin-top: 5px; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="scene-box" id="sceneBox">
        <div class="scene-chips">
          <button class="chip" id="soundToggle" type="button" aria-pressed="false"></button>
          <button class="chip" id="langToggle" type="button"></button>
        </div>
        <div class="scene-hint" id="sceneHint"></div>
      </div>

      <p class="intro" id="introLine"></p>
      <p class="count-line" id="countLine"></p>

      <div class="actions">
        <button class="action" id="btnSit" type="button" aria-pressed="false">
          <svg class="a-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="3.4"/></svg>
          <span class="a-label" data-i18n="sit"></span>
          <span class="a-sub" data-i18n="sitSub"></span>
        </button>
        <button class="action" id="btnHymn" type="button" aria-pressed="false">
          <svg class="a-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18.5V6l10-2v11.5"/><circle cx="6.5" cy="18.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/></svg>
          <span class="a-label" data-i18n="hymn"></span>
          <span class="a-sub" data-i18n="hymnSub"></span>
        </button>
        <button class="action" id="btnVerse" type="button" aria-pressed="false">
          <svg class="a-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-1.8-1.5-4-2-7-2v14c3 0 5.2.5 7 2 1.8-1.5 4-2 7-2V4c-3 0-5.2.5-7 2z"/><path d="M12 6v14"/></svg>
          <span class="a-label" data-i18n="verse"></span>
          <span class="a-sub" data-i18n="verseSub"></span>
        </button>
        <button class="action" id="btnCandle" type="button" aria-pressed="false">
          <svg class="a-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1.2 1.8 2 3 2 4.4A2 2 0 0 1 10 7.4C10 6 10.8 4.8 12 3z"/><path d="M9.5 11.5h5V21h-5z"/></svg>
          <span class="a-label" data-i18n="candle"></span>
          <span class="a-sub" data-i18n="candleSub"></span>
        </button>
      </div>

      <section class="panel breath-wrap" id="panelSit" hidden>
        <div class="breath-ring"><div class="breath-core" id="breathCore"></div></div>
        <div class="breath-word" id="breathWord"></div>
        <div class="breath-timer" id="breathTimer">0:00</div>
      </section>

      <section class="panel verse-card" id="panelVerse" hidden>
        <p class="verse-text" id="verseText"></p>
        <div class="verse-ref" id="verseRef"></div>
      </section>

      <section class="panel" id="panelCandle" hidden>
        <form id="candleForm" novalidate>
          <div class="field">
            <label for="cName"><span data-i18n="nameLabel"></span><span class="char-n" id="nameCount"></span></label>
            <input id="cName" type="text" maxlength="24" autocomplete="off" />
          </div>
          <div class="field">
            <label for="cLine"><span data-i18n="lineLabel"></span><span class="char-n" id="lineCount"></span></label>
            <input id="cLine" type="text" maxlength="80" autocomplete="off" />
          </div>
          <button class="primary-btn" id="candleSubmit" type="submit"></button>
          <p class="form-note" id="formNote"></p>
        </form>
      </section>

      <section class="panel read-card" id="panelRead" hidden>
        <div class="read-flame" aria-hidden="true">🕯</div>
        <p class="read-line" id="readLine"></p>
        <div class="read-name" id="readName"></div>
        <button class="quiet-btn" id="readClose" type="button"></button>
      </section>

      <div class="stand-list" id="standList">
        <div class="stand-title" id="standTitle"></div>
        <div class="stand-chips" id="standChips"></div>
        <p class="stand-empty" id="standEmpty" hidden></p>
      </div>

      <footer>
        <div class="f-brand">Quiet America · Velagrid Technologies</div>
        <div class="f-line" id="footerLine"></div>
      </footer>
    </main>

          ctx.beginPath();
          ctx.moveTo(-13, 26); ctx.quadraticCurveTo(-11, -6, -6, -14);
          ctx.lineTo(6, -14); ctx.quadraticCurveTo(11, -6, 13, 26);
          ctx.closePath(); ctx.fill();
          // head
          ctx.fillStyle = css(app.skin);
          ctx.beginPath(); ctx.arc(0, -26, 12.5, 0, Math.PI * 2); ctx.fill();
          // eyes
          ctx.strokeStyle = "#2b2118"; ctx.lineWidth = 1.6; ctx.lineCap = "round";
          if (opts.eyesClosed) {
            ctx.beginPath();
            ctx.moveTo(-6.5, -25); ctx.quadraticCurveTo(-4, -23.4, -1.5, -25);
            ctx.moveTo(1.5, -25); ctx.quadraticCurveTo(4, -23.4, 6.5, -25);
            ctx.stroke();
          } else {
            ctx.fillStyle = "#2b2118";
            ctx.beginPath(); ctx.arc(-4.2, -25.5, 1.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(4.2, -25.5, 1.5, 0, Math.PI * 2); ctx.fill();
          }
          // hat: brim + crown
          ctx.fillStyle = css(app.hat);
          ctx.beginPath(); ctx.ellipse(0, -35, 17, 4.2, 0, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath();
          ctx.moveTo(-9, -35); ctx.lineTo(-7.6, -48); ctx.quadraticCurveTo(0, -51, 7.6, -48); ctx.lineTo(9, -35);
          ctx.closePath(); ctx.fill();
          ctx.restore();
        }

        function frame(now) {
          if (!W) resize();
          var t = (now - start) / 1000;
          hits = [];
          // walls & floor
          var wallG = ctx.createLinearGradient(0, 0, 0, H);
          wallG.addColorStop(0, "#f7efdb"); wallG.addColorStop(0.62, "#f1e5cb"); wallG.addColorStop(0.621, "#c49a68"); wallG.addColorStop(1, "#a87f52");
          ctx.fillStyle = wallG; ctx.fillRect(0, 0, W, H);
          var horizon = H * 0.62, cx = W / 2;

          // stained-glass window
          var ww = Math.min(W * 0.30, 130), wh = ww * 1.8;
          var wx = cx - ww / 2, wy = H * 0.06;
          var paneCols = ["#c94f42", "#3f6fb5", "#e0a83c", "#4d8a5a", "#7a4a8c", "#d97b2f", "#4a90a4"];
          ctx.save();
          ctx.beginPath(); ctx.rect(wx, wy, ww, wh); ctx.clip();
          var pw = ww / 3, ph = wh / 5;
          for (var i = 0; i < 3; i++) for (var j = 0; j < 5; j++) {
            ctx.fillStyle = paneCols[(i * 2 + j * 3) % paneCols.length];
            ctx.fillRect(wx + i * pw + 1.5, wy + j * ph + 1.5, pw - 3, ph - 3);
          }
          ctx.fillStyle = "#f3d489";
          ctx.beginPath(); ctx.arc(cx, wy + wh * 0.34, ww * 0.17, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "#6d4f30"; ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(cx, wy + wh * 0.34 - ww * 0.13); ctx.lineTo(cx, wy + wh * 0.34 + ww * 0.13);
          ctx.moveTo(cx - ww * 0.11, wy + wh * 0.34 - ww * 0.045); ctx.lineTo(cx + ww * 0.11, wy + wh * 0.34 - ww * 0.045);
          ctx.stroke();
          ctx.restore();
          ctx.strokeStyle = "#6d4f30"; ctx.lineWidth = 5; ctx.strokeRect(wx, wy, ww, wh);

          // small cross, left of window
          ctx.fillStyle = "#6d4f30";
          ctx.fillRect(cx - ww * 0.85 - 3, wy + wh * 0.2, 6, wh * 0.34);
          ctx.fillRect(cx - ww * 0.85 - 16, wy + wh * 0.2 + wh * 0.1, 38, 6);

          // drifting colored light on the floor (VERY slow)
          var drift = Math.sin(t * 0.045) * W * 0.05;
          ctx.save();
          ctx.globalAlpha = 0.30;
          ctx.translate(cx + drift, horizon + (H - horizon) * 0.38);
          ctx.rotate(0.3); ctx.scale(1, 0.42);
          var lg = ctx.createRadialGradient(0, 0, 8, 0, 0, W * 0.24);
          lg.addColorStop(0, "#e0a83c"); lg.addColorStop(0.45, "#c96a54"); lg.addColorStop(0.75, "#5a7fb5"); lg.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = lg;
          ctx.beginPath(); ctx.arc(0, 0, W * 0.24, 0, Math.PI * 2); ctx.fill();
          ctx.restore();

          // aisle runner
          ctx.fillStyle = "#9e4f43";
          ctx.beginPath();
          ctx.moveTo(cx - W * 0.045, horizon); ctx.lineTo(cx + W * 0.045, horizon);
          ctx.lineTo(cx + W * 0.11, H); ctx.lineTo(cx - W * 0.11, H);
          ctx.closePath(); ctx.fill();

          // pews (two columns, four rows)
          var pewRowsY = [0.70, 0.79, 0.88, 0.965];
          ctx.fillStyle = "#8a6844";
          pewRowsY.forEach(function (fy) {
            var y = H * fy, wP = W * 0.30, hP = H * 0.028;
            [-1, 1].forEach(function (side) {
              var x0 = side < 0 ? cx - W * 0.135 - wP : cx + W * 0.135;
              ctx.fillStyle = "#6d4f30"; ctx.fillRect(x0, y - hP * 1.5, wP, hP * 0.8);
              ctx.fillStyle = "#8a6844"; ctx.fillRect(x0, y - hP * 0.6, wP, hP);
              ctx.fillStyle = "#755631"; ctx.fillRect(x0, y + hP * 0.4, wP, hP * 0.5);
            });
          });

          // neighbours seated (from real rows, latest 8)
          var seatSpots = [
            { fx: -0.26, fy: 0.665 }, { fx: 0.24, fy: 0.665 }, { fx: -0.33, fy: 0.755 }, { fx: 0.31, fy: 0.755 },
            { fx: -0.24, fy: 0.845 }, { fx: 0.35, fy: 0.845 }, { fx: -0.36, fy: 0.928 }, { fx: 0.22, fy: 0.928 }
          ];
          rows.slice(0, 8).forEach(function (row, i) {
            var sp = seatSpots[i];
            var x = cx + sp.fx * W, y = H * sp.fy;
            var s = 0.62 + (sp.fy - 0.66) * 0.9;
            drawFigure(x, y, s, appearanceFor(row), { breath: 1 + Math.sin(t * 0.8 + i * 2.1) * 0.008 });
            hits.push({ x: x, y: y - 20 * s, r: 34 * s + 8, record: row });
          });

          // candle stand (front right)
          var sx = W * 0.845, sy = H * 0.60;
          ctx.fillStyle = "#6d4f30";
          ctx.fillRect(sx - W * 0.085, sy, W * 0.17, 5);
          ctx.fillRect(sx - W * 0.075, sy + 5, 5, H * 0.10);
          ctx.fillRect(sx + W * 0.075 - 5, sy + 5, 5, H * 0.10);
          rows.slice(0, 24).forEach(function (row, i) {
            var col = i % 8, r2 = Math.floor(i / 8);
            var cxx = sx - W * 0.070 + col * (W * 0.14 / 7);
            var cyy = sy - 4 - r2 * 13;
            ctx.fillStyle = "#f6ecd4"; ctx.fillRect(cxx - 2.2, cyy - 9, 4.4, 9);
            var fl = 1 + Math.sin(t * 7 + i * 1.7) * 0.15;
            ctx.fillStyle = "#ffc45e";
            ctx.beginPath(); ctx.ellipse(cxx, cyy - 12.5, 2.4, 4.2 * fl, 0, 0, Math.PI * 2); ctx.fill();
            hits.push({ x: cxx, y: cyy - 8, r: 11, record: row });
          });

          // visitor: walks down the aisle, then sits (left pew, second row)
          var walkDur = 6.2;
          var p = Math.min(1, t / walkDur);
          var eased = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
          var vx, vy, vs;
          if (p < 1) {
            // from horizon (door) toward viewer along the aisle, slight turn at the end
            var along = eased;
            vy = horizon + (H * 0.80 - horizon) * along;
            vx = cx + Math.sin(along * Math.PI) * 2 - (along > 0.9 ? (along - 0.9) * W * 0.9 : 0);
            vs = 0.45 + along * 0.75;
            vy += Math.abs(Math.sin(t * 5.2)) * -2;
          } else {
            vx = cx - W * 0.245; vy = H * 0.755; vs = 1.06;
          }
          var breath = 1;
          var eyesClosed = false;
          if (p >= 1 && sitting) {
            var ph = (t % 8) / 8;
            breath = 1 + Math.sin(ph * Math.PI * 2) * 0.02;
            eyesClosed = true;
          }
          drawFigure(vx, vy, vs, { coat: 0x74563c, skin: 0xf0c08a, hat: 0x4a3b2c }, { breath: breath, eyesClosed: eyesClosed });
        }

        canvas.addEventListener("pointerdown", function (ev) {
          var rect = canvas.getBoundingClientRect();
          var x = ev.clientX - rect.left, y = ev.clientY - rect.top;
          for (var i = hits.length - 1; i >= 0; i--) {
            var dx = x - hits[i].x, dy = y - hits[i].y;
            if (dx * dx + dy * dy <= hits[i].r * hits[i].r) { onTap(hits[i].record); return; }
          }
        });

        return {
          frame: frame,
          resize: resize,
          setCandles: function (r) { rows = r || []; },
          setSitting: function (v) { sitting = v; }
        };
      }

      /* ================= Scene boot (3D, else 2D fallback) ================= */
      var sceneBox = document.getElementById("sceneBox");
      var activeScene = null;
      function showReading(row) {
        if (!row) return;
        document.getElementById("readLine").textContent = row.line || "";
        document.getElementById("readName").textContent = t().readBy(row.name || "");
        document.getElementById("panelRead").hidden = false;
        document.getElementById("panelRead").scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
      function bootScene() {
        var use3D = false;
        try {
          if (window.THREE) {
            var testCanvas = document.createElement("canvas");
            var gl = testCanvas.getContext("webgl") || testCanvas.getContext("experimental-webgl");
            if (gl) use3D = true;
          }
        } catch (e) { use3D = false; }
        if (use3D) {
          try {
            activeScene = createScene3D(sceneBox, showReading);
          } catch (e) {
            activeScene = null;
          }
        }
        if (!activeScene) {
          activeScene = createScene2D(sceneBox, showReading);
        }
        window.__scene = activeScene;
        activeScene.setCandles(storeState.rows);
        window.addEventListener("resize", function () { activeScene.resize(); });
        function loop(now) {
          activeScene.frame(now);
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
      }
</script>

    <script>
      "use strict";
      /* ================= Audio (WebAudio, off by default) ================= */
      var AudioEngine = {
        ctx: null, master: null, pad: null, padOn: false, hymnOn: false, hymnTimer: null, hymnStep: 0,
        ensure: function () {
          if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          this.ctx = new AC();
          this.master = this.ctx.createGain();
          this.master.gain.value = 0.9;
          this.master.connect(this.ctx.destination);
        },
        /* --- faint meditation pad (sound toggle) --- */
        startPad: function () {
          this.ensure(); if (!this.ctx || this.pad) return;
          var ctx = this.ctx;
          var gain = ctx.createGain(); gain.gain.value = 0;
          gain.gain.linearRampToValueAtTime(0.035, ctx.currentTime + 2.5);
          var filter = ctx.createBiquadFilter(); filter.type = "lowpass"; filter.frequency.value = 520;
          filter.connect(gain); gain.connect(this.master);
          var oscs = [];
          [196.0, 246.94, 293.66].forEach(function (f, i) {
            var o = ctx.createOscillator();
            o.type = i === 0 ? "sine" : "triangle";
            o.frequency.value = f; o.detune.value = (i - 1) * 4;
            o.connect(filter); o.start(); oscs.push(o);
          });
          var lfo = ctx.createOscillator(); lfo.frequency.value = 0.07;
          var lfoGain = ctx.createGain(); lfoGain.gain.value = 90;
          lfo.connect(lfoGain); lfoGain.connect(filter.frequency); lfo.start();
          this.pad = { oscs: oscs, gain: gain, lfo: lfo };
          this.padOn = true;
        },
        stopPad: function () {
          if (!this.pad) { this.padOn = false; return; }
          var pad = this.pad, ctx = this.ctx;
          pad.gain.gain.cancelScheduledValues(ctx.currentTime);
          pad.gain.gain.setValueAtTime(pad.gain.gain.value, ctx.currentTime);
          pad.gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.2);
          setTimeout(function () {
            pad.oscs.forEach(function (o) { try { o.stop(); } catch (e) {} });
            try { pad.lfo.stop(); } catch (e) {}
          }, 1400);
          this.pad = null; this.padOn = false;
        },
        /* --- quiet organ: Amazing Grace (public-domain melody) --- */
        melody: [
          ["D4", 1], ["G4", 2], ["B4", 1], ["G4", 1], ["B4", 1], ["A4", 2], ["G4", 1],
          ["E4", 2], ["D4", 1], ["D4", 1], ["G4", 2], ["B4", 1], ["G4", 1], ["B4", 1],
          ["A4", 2], ["D5", 1], ["D5", 2], ["B4", 1], ["D5", 1], ["B4", 1], ["G4", 1],
          ["D4", 1], ["E4", 1], ["G4", 2], ["E4", 1], ["D4", 3]
        ],
        freq: function (note) {
          var map = { D4: 293.66, E4: 329.63, G4: 392.0, A4: 440.0, B4: 493.88, D5: 587.33 };
          return map[note] || 392;
        },
        playNote: function (freq, dur) {
          var ctx = this.ctx;
          var t0 = ctx.currentTime;
          var gain = ctx.createGain();
          gain.gain.setValueAtTime(0, t0);
          gain.gain.linearRampToValueAtTime(0.055, t0 + 0.09);
          gain.gain.setValueAtTime(0.055, t0 + Math.max(0.1, dur - 0.12));
          gain.gain.linearRampToValueAtTime(0, t0 + dur);
          var filter = ctx.createBiquadFilter(); filter.type = "lowpass"; filter.frequency.value = 1500;
          filter.connect(gain); gain.connect(this.master);
          [[1, 1.0], [2, 0.42], [3, 0.16], [4, 0.07]].forEach(function (h) {
            var o = ctx.createOscillator();
            o.type = "sine"; o.frequency.value = freq * h[0];
            var og = ctx.createGain(); og.gain.value = h[1];
            o.connect(og); og.connect(filter);
            o.start(t0); o.stop(t0 + dur + 0.05);
          });
        },
        scheduleStep: function () {
          if (!this.hymnOn) return;
          var beat = 0.92;
          var item = this.melody[this.hymnStep % this.melody.length];
          var dur = item[1] * beat;
          this.playNote(this.freq(item[0]), dur);
          this.hymnStep++;
          var self = this;
          this.hymnTimer = setTimeout(function () { self.scheduleStep(); }, dur * 1000);
        },
        startHymn: function () {
          this.ensure(); if (!this.ctx) return;
          this.hymnOn = true; this.hymnStep = 0;
          this.scheduleStep();
        },
        stopHymn: function () {
          this.hymnOn = false;
          if (this.hymnTimer) { clearTimeout(this.hymnTimer); this.hymnTimer = null; }
        }
      };

      /* ================= UI wiring ================= */
      var $ = function (id) { return document.getElementById(id); };
      var sittingState = { on: false, startedAt: 0, timerInt: null };

      function applyLang() {
        setHtmlLang();
        var s = t();
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var key = el.getAttribute("data-i18n");
          if (s[key]) el.textContent = s[key];
        });
        // sitting button may be in its "stop" state
        if (sittingState.on) {
          document.querySelector('#btnSit .a-label').textContent = s.sitStop;
          document.querySelector('#btnSit .a-sub').textContent = s.sitStopSub;
        }
        if (AudioEngine.hymnOn) {
          document.querySelector('#btnHymn .a-label').textContent = s.hymnStop;
          document.querySelector('#btnHymn .a-sub').textContent = s.hymnStopSub;
        }
        $("introLine").textContent = s.intro;
        $("sceneHint").textContent = s.hint;
        $("soundToggle").textContent = AudioEngine.padOn ? s.soundOn : s.soundOff;
        $("langToggle").textContent = lang === "zh" ? "EN" : "中文";
        $("cName").placeholder = s.namePh;
        $("cLine").placeholder = s.linePh;
        $("candleSubmit").textContent = s.lightIt;
        $("readClose").textContent = s.close;
        $("standTitle").textContent = s.standTitle;
        $("standEmpty").textContent = s.standEmpty;
        $("footerLine").textContent = s.footer;
        var v = verseForToday();
        $("verseText").textContent = lang === "zh" ? v.zh : v.en;
        $("verseRef").textContent = lang === "zh" ? v.refZh : v.refEn;
        renderCount();
        renderStandList();
        updateCharCounts();
      }

      function renderCount() {
        if (storeState.total === null) $("countLine").innerHTML = t().countUnknown;
        else $("countLine").innerHTML = t().count(storeState.total);
      }

      function renderStandList() {
        var wrap = $("standChips");
        wrap.innerHTML = "";
        var rows = storeState.rows;
        $("standEmpty").hidden = rows.length > 0;
        rows.forEach(function (row) {
          var b = document.createElement("button");
          b.type = "button"; b.className = "candle-chip";
          var dot = document.createElement("span"); dot.className = "dot";
          b.appendChild(dot);
          b.appendChild(document.createTextNode(row.name || ""));
          b.addEventListener("click", function () { showReading(row); });
          wrap.appendChild(b);
        });
      }

      /* --- language & sound toggles --- */
      $("langToggle").addEventListener("click", function () {
        lang = lang === "zh" ? "en" : "zh";
        saveLang();
        applyLang();
      });
      $("soundToggle").addEventListener("click", function () {
        if (AudioEngine.padOn) AudioEngine.stopPad(); else AudioEngine.startPad();
        this.setAttribute("aria-pressed", AudioEngine.padOn ? "true" : "false");
        this.textContent = AudioEngine.padOn ? t().soundOn : t().soundOff;
      });

      /* --- 1. Sit a while --- */
      function fmtElapsed(ms) {
        var sec = Math.floor(ms / 1000);
        var m = Math.floor(sec / 60), s = sec % 60;
        return m + ":" + (s < 10 ? "0" : "") + s;
      }
      $("btnSit").addEventListener("click", function () {
        var s = t();
        if (!sittingState.on) {
          sittingState.on = true;
          sittingState.startedAt = Date.now();
          $("panelSit").hidden = false;
          this.setAttribute("aria-pressed", "true");
          document.querySelector('#btnSit .a-label').textContent = s.sitStop;
          document.querySelector('#btnSit .a-sub').textContent = s.sitStopSub;
          if (window.__scene) window.__scene.setSitting(true);
          $("breathTimer").textContent = "0:00";
          sittingState.timerInt = setInterval(function () {
            $("breathTimer").textContent = fmtElapsed(Date.now() - sittingState.startedAt);
          }, 500);
          $("panelSit").scrollIntoView({ behavior: "smooth", block: "nearest" });
        } else {
          sittingState.on = false;
          clearInterval(sittingState.timerInt);
          $("panelSit").hidden = true;
          this.setAttribute("aria-pressed", "false");
          document.querySelector('#btnSit .a-label').textContent = s.sit;
          document.querySelector('#btnSit .a-sub').textContent = s.sitSub;
          if (window.__scene) window.__scene.setSitting(false);
        }
      });
      /* breathing ring: 4s in, 4s out, synced word */
      (function breathLoop() {
        var core = $("breathCore"), word = $("breathWord");
        function tick(now) {
          if (sittingState.on) {
            var ph = (now % 8000) / 8000;
            var scale, w;
            if (ph < 0.5) { var f = ph / 0.5; scale = 0.72 + 0.28 * (0.5 - 0.5 * Math.cos(f * Math.PI)); w = t().breatheIn; }
            else { var f2 = (ph - 0.5) / 0.5; scale = 1.0 - 0.28 * (0.5 - 0.5 * Math.cos(f2 * Math.PI)); w = t().breatheOut; }
            core.style.transform = "scale(" + scale.toFixed(3) + ")";
            if (word.textContent !== w) word.textContent = w;
          }
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      })();

      /* --- 2. Hear the hymn --- */
      $("btnHymn").addEventListener("click", function () {
        var s = t();
        if (AudioEngine.hymnOn) {
          AudioEngine.stopHymn();
          this.setAttribute("aria-pressed", "false");
          document.querySelector('#btnHymn .a-label').textContent = s.hymn;
          document.querySelector('#btnHymn .a-sub').textContent = s.hymnSub;
        } else {
          AudioEngine.startHymn();
          this.setAttribute("aria-pressed", "true");
          document.querySelector('#btnHymn .a-label').textContent = s.hymnStop;
          document.querySelector('#btnHymn .a-sub').textContent = s.hymnStopSub;
        }
      });

      /* --- 3. A verse for today --- */
      $("btnVerse").addEventListener("click", function () {
        var panel = $("panelVerse");
        var show = panel.hidden;
        panel.hidden = !show;
        this.setAttribute("aria-pressed", show ? "true" : "false");
        if (show) panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });

      /* --- 4. Light a candle --- */
      $("btnCandle").addEventListener("click", function () {
        var panel = $("panelCandle");
        var show = panel.hidden;
        panel.hidden = !show;
        this.setAttribute("aria-pressed", show ? "true" : "false");
        if (show) { panel.scrollIntoView({ behavior: "smooth", block: "nearest" }); $("cName").focus(); }
      });
      function updateCharCounts() {
        $("nameCount").textContent = $("cName").value.length + " / 24";
        $("lineCount").textContent = $("cLine").value.length + " / 80";
      }
      $("cName").addEventListener("input", updateCharCounts);
      $("cLine").addEventListener("input", updateCharCounts);

      $("candleForm").addEventListener("submit", function (ev) {
        ev.preventDefault();
        var s = t();
        var name = $("cName").value.trim().slice(0, 24);
        var line = $("cLine").value.trim().slice(0, 80);
        var note = $("formNote");
        note.className = "form-note";
        if (!name || !line) { note.textContent = s.needBoth; return; }
        if (isBlocked(name) || isBlocked(line)) { note.textContent = s.filterMsg; return; }
        var btn = $("candleSubmit");
        btn.disabled = true;
        postCandle(name, line).then(function () {
          note.className = "form-note ok";
          note.textContent = s.thanks;
          $("cName").value = ""; $("cLine").value = "";
          updateCharCounts();
          btn.disabled = false;
          refreshStore();
        }).catch(function () {
          note.textContent = s.resting;
          btn.disabled = false;
        });
      });

      $("readClose").addEventListener("click", function () { $("panelRead").hidden = true; });

      /* ================= Boot ================= */
      applyLang();
      bootScene();
      refreshStore();
</script>
