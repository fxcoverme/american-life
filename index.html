    /* ================= 2.5D 等距模块化城市（呈现层样板） =================
       选定路线后，闯关地图顶部是一座微缩城市：每一关是一栋独立楼宇模块
       （按 SCENE_KIND 生成：餐馆 / 学校 / 公寓 / 政府楼 / 车行 / 房屋…），
       带街道、光影与纵深；空位补公园 / 海滩 / 小店。小人（所选头像 + 服装）
       沿街道走动、小跑到当前关卡的楼门口；进餐馆关时走到店门口的露天座
       坐下，选的食物以 pop 动画蹦到桌上。纯呈现层：金币 / 数值 / 关卡引擎不动。 */
    const CITY_VW = 520, CITY_VH = 340;
    const BL_H = [[78, 64, 88, 58, 72, 84], [58, 50, 62, 48, 56, 52]];
    const KIND_STYLE = {
      restaurant:{ wall:"#f7e7c3", side:"#e6cc97", roof:"#c8402a" },
      school:{ wall:"#eda87b", side:"#d18a5f", roof:"#8a4a2e" },
      campus:{ wall:"#c3dcef", side:"#a3c3dd", roof:"#5b84a8" },
      office:{ wall:"#aecfec", side:"#8fb2d6", roof:"#42648c" },
      govt:{ wall:"#f0ead9", side:"#d9d0b8", roof:"#8a8578" },
      court:{ wall:"#f0ead9", side:"#d9d0b8", roof:"#6e6a5e" },
      apartment:{ wall:"#dccdf0", side:"#c2aede", roof:"#7a6396" },
      house:{ wall:"#f3ddba", side:"#e0c491", roof:"#b8562f" },
      dealer:{ wall:"#e2ecf5", side:"#c3d2e0", roof:"#2456a6" },
      airport:{ wall:"#d3dde9", side:"#aebccf", roof:"#31405e" },
      street:{ wall:"#f2deb8", side:"#dec394", roof:"#96702e" },
      truck:{ wall:"#e6e3da", side:"#c9c5ba", roof:"#5a6068" },
      highway:{ wall:"#e6e3da", side:"#c9c5ba", roof:"#5a6068" },

    function plotPos(i){
      const row = i < 6 ? 0 : 1, c = i % 6;
      return row === 0 ? { cx: 48 + c*84, base: 196, row: row, w: 64 } : { cx: 72 + c*80, base: 292, row: row, w: 62 };
    }
    function doorOf(i){ const p = plotPos(i); return { x: p.cx, y: p.base + 3, row: p.row }; }
    function streetY(row){ return row === 0 ? 212 : 307; }
    function dinerPos(p){ const side = p.cx > 380 ? -1 : 1; return { side: side, tx: p.cx + side*36 }; }
    /* 一栋楼：正面 + 侧面 + 屋顶斜面（等距感）+ 窗格 + 门 + 招牌小图标 */
    function isoBuilding(p, h, kind, icon, state, idx){
      const st = KIND_STYLE[kind] || KIND_STYLE.street;
      const x = p.cx - p.w/2, top = p.base - h, dx = 12, dy = -7;
      let s = `<ellipse cx="${p.cx + 6}" cy="${p.base + 4}" rx="${p.w/2 + 9}" ry="6" fill="rgba(20,26,40,.18)"/>`;
      s += `<polygon points="${x + p.w},${top} ${x + p.w + dx},${top + dy} ${x + p.w + dx},${p.base + dy} ${x + p.w},${p.base}" fill="${st.side}"/>`;
      s += `<rect x="${x}" y="${top}" width="${p.w}" height="${h}" fill="${st.wall}"/>`;
      if (kind === "house") s += `<polygon points="${x - 4},${top} ${p.cx},${top - 17} ${x + p.w + 4},${top}" fill="${st.roof}"/>`;
      else s += `<polygon points="${x},${top} ${x + dx},${top + dy} ${x + p.w + dx},${top + dy} ${x + p.w},${top}" fill="${st.roof}"/>`;
      const wc = 3, wr = Math.max(1, Math.floor((h - 36) / 15));
      for (let i = 0; i < wc; i++) for (let j = 0; j < wr; j++)
        s += `<rect x="${Math.round(x + 8 + i * ((p.w - 26) / (wc - 1)))}" y="${top + 10 + j * 15}" width="9" height="8" rx="1.5" fill="#ffe9a8" opacity=".9"/>`;
      if (kind === "govt" || kind === "court")
        for (let i = 0; i < 4; i++) s += `<rect x="${x + 7 + i * ((p.w - 16) / 3)}" y="${top + 8}" width="4.5" height="${h - 12}" fill="rgba(255,255,255,.75)"/>`;
      if (kind === "dealer"){
        s += `<rect x="${x + 5}" y="${p.base - 25}" width="${p.w - 10}" height="21" rx="3" fill="#bfe0ff" opacity=".85"/><text x="${p.cx}" y="${p.base - 9}" text-anchor="middle" font-size="14">🚗</text>`;
      } else {
        s += `<rect x="${p.cx - 6}" y="${p.base - 15}" width="12" height="15" rx="2" fill="#4a3626"/><circle cx="${p.cx + 3}" cy="${p.base - 7}" r="1.3" fill="#e9a13b"/>`;
      }
      if (kind === "restaurant")
        s += `<polygon points="${x - 3},${p.base - 21} ${x + p.w + 3},${p.base - 21} ${x + p.w - 1},${p.base - 13} ${x + 1},${p.base - 13}" fill="url(#awnP)" stroke="rgba(140,40,25,.35)" stroke-width="1"/>`;
      s += slotChip(p.cx, top - 3, icon, 11);
      if (state === "done") s += slotChip(x + p.w + 1, top + 13, "✅", 9);
      if (state === "now") s += `<circle class="nowpulse" cx="${p.cx}" cy="${top - 3}" r="14"/>`;
      const attrs = (idx !== undefined && state !== "lock") ? ` data-play="${idx}" style="cursor:pointer"` : "";
      return `<g${attrs}${state === "lock" ? ` opacity=".5"` : ""}>${s}</g>`;
    }
    /* 空位装饰地块：公园 / 海滩 / 小店，让城市完整 */
    function decoPlot(p, kind){
      if (kind === "beach")
        return `<g><rect x="${p.cx - 34}" y="${p.base - 32}" width="68" height="36" rx="9" fill="#f2d492"/>

          <text x="${p.cx - 12}" y="${p.base - 8}" text-anchor="middle" font-size="19">🌳</text><text x="${p.cx + 13}" y="${p.base - 10}" text-anchor="middle" font-size="15">🌲</text></g>`;

    /* 餐馆门口的露天座：遮阳伞 + 圆桌 + 两把椅（初始收起，走到门口时 pop 出） */
    function dinerSetSVG(p){

        <polygon points="${tx - 27},${ty - 27} ${tx + 27},${ty - 27} ${tx},${ty - 47}" fill="#e9a13b" stroke="#c9822a" stroke-width="1.5"/>
        <rect x="${tx - 1.5}" y="${ty - 28}" width="3" height="25" fill="#8a5a12"/>

        <rect x="${tx - 31}" y="${ty - 3}" width="9" height="12" rx="3" fill="#5a7a9c"/>
        <rect x="${tx + 22}" y="${ty - 3}" width="9" height="12" rx="3" fill="#5a7a9c"/>
      </g>`;
    }
    function citySceneSVG(opts){
      opts = opts || {};
      const levels = ROUTES[G.route].levels;
      let buildings = "";
      for (let i = 0; i < 12; i++){
        const p = plotPos(i);
        if (i < levels.length){
          const lv = levels[i];
          const state = i < G.unlocked ? "done" : i === G.unlocked ? "now" : "lock";
          buildings += isoBuilding(p, BL_H[p.row][i % 6], SCENE_KIND[lv.id] || "street", lv.icon, state, opts.noClick ? undefined : i);
          if (opts.dinerFor === i) buildings += dinerSetSVG(p);

          buildings += decoPlot(p, ["park", "beach", "shop"][(i - levels.length) % 3]);

      return `<svg viewBox="0 0 ${CITY_VW} ${CITY_VH}" role="img" aria-label="${cityName()}">

          <linearGradient id="cSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd2ff"/><stop offset=".55" stop-color="#cdeffd"/><stop offset="1" stop-color="#ffe9b0"/></linearGradient>
          <radialGradient id="cGlow"><stop offset="0" stop-color="rgba(255,246,200,.95)"/><stop offset="1" stop-color="rgba(255,246,200,0)"/></radialGradient>
          <pattern id="awnP" width="11" height="11" patternUnits="userSpaceOnUse"><rect width="5.5" height="11" fill="#c8402a"/><rect x="5.5" width="5.5" height="11" fill="#fff6ea"/></pattern>
        </defs>
        <rect width="520" height="340" fill="url(#cSky)"/>
        <circle cx="52" cy="30" r="26" fill="url(#cGlow)"/><circle cx="52" cy="30" r="13" fill="#fff3c4"/>
        ${skylineSVG(66, "#31405e", .38, .38)}
        ${landmarkSVG(474, 32, "cGlow")}
        <rect x="0" y="64" width="520" height="276" fill="#bfd3a6"/>

        <g fill="#f6f1e7"><rect x="24" y="209" width="46" height="5" rx="2.5"/><rect x="150" y="209" width="46" height="5" rx="2.5"/><rect x="276" y="209" width="46" height="5" rx="2.5"/><rect x="402" y="209" width="46" height="5" rx="2.5"/></g>

        <rect x="0" y="324" width="520" height="16" fill="#9db38a"/>
        <text x="14" y="337" font-size="15">🚏</text>
        ${buildings}

    /* ---------------- 城市小人：行走 / 小跑 / 坐下 ---------------- */
    let cityTimers = [];
    function cityLater(fn, ms){ const id = setTimeout(fn, ms); cityTimers.push(id); return id; }
    function stopCity(){ cityTimers.forEach(clearTimeout); cityTimers = []; }
    function propHTML(of){ return of.culture === "af" ? `<span class="ksw"></span>` : of.p; }
    function makeWalker(box, of){
      const w = document.createElement("div");
      w.className = "walker2 idle";
      w.setAttribute("aria-hidden", "true");
      w.innerHTML = `<div class="w2bob"><div class="w2flip"><span class="w2face">${of.a}</span><span class="w2torso"></span><span class="w2prop">${propHTML(of)}</span></div></div>`;
      box.appendChild(w);
      return w;
    }
    function placeWalker(w, vx, vy){
      w._vx = vx; w._vy = vy;
      w.style.transition = "none";
      w.style.left = (vx / CITY_VW * 100) + "%";
      w.style.top = (vy / CITY_VH * 100) + "%";
    }
    /* 沿折线点位行走：速度恒定（单位/秒），水平移动时翻转朝向，带走路摆动 */
    function walkPath(w, pts, speed, done){
      let i = 0;
      const stepSnd = setInterval(()=>{ if (!w.isConnected || !w.classList.contains("walking")){ clearInterval(stepSnd); return; } sfxStep(); }, 300);   /* 走路脚步声（轻） */
      const step = ()=>{
        if (!w.isConnected){ clearInterval(stepSnd); return; }
        if (i >= pts.length){ clearInterval(stepSnd); w.classList.remove("walking"); w.classList.add("idle"); if (done) done(); return; }
        const tx = pts[i][0], ty = pts[i][1];
        const dx = tx - (w._vx || 0), dy = ty - (w._vy || 0);
        const dist = Math.sqrt(dx * dx + dy * dy);
        const dur = Math.max(150, Math.min(2100, dist / (speed || 300) * 1000));
        const flip = w.querySelector(".w2flip");
        if (flip && Math.abs(dx) > 4) flip.style.transform = dx < 0 ? "scaleX(-1)" : "";
        w.classList.add("walking"); w.classList.remove("idle");
        w.style.transition = "left " + dur + "ms linear, top " + dur + "ms linear";
        w._vx = tx; w._vy = ty;
        w.style.left = (tx / CITY_VW * 100) + "%";
        w.style.top = (ty / CITY_VH * 100) + "%";

    function streetPath(from, to){
      const pts = [];
      if (from.isDoor) pts.push([from.x, streetY(from.row)]);
      if (from.row !== to.row){ pts.push([26, streetY(from.row)]); pts.push([26, streetY(to.row)]); }

    /* 全游戏统一的道具 pop：在指定容器 (x%, y%) 处以弹跳动画蹦出一个 emoji */

    /* 地图上的小人：从上一关楼门口（或入境口）走到当前关卡楼门口 */
    function setupCityWalker(){

      if (pendingWalk && pendingWalk.route === G.route){

          from = doorOf(pendingWalk.from); from.isDoor = true; animate = true;
        }
      } else if (G.unlocked === 0) animate = true;
      const isArrival = !!(pendingWalk && pendingWalk.from === -1 && animate);

      placeWalker(w, from.x, from.y);

    let pendingWalk = null; // {from, route}：通关后由 finishLevel 设置，地图打开时播放行走动画
    function setupWalker(){
      const mapEl = $(".map");
      if (!mapEl || !G) return;
      const dots = mapEl.querySelectorAll(".node .dot");
      if (!dots.length) return;
      const target = Math.min(G.unlocked, dots.length - 1);
      const lv = ROUTES[G.route].levels[target];

      const w = document.createElement("div");

      w.innerHTML = `<div class="win"><span class="wava">${of.a}</span><span class="wprop">${of.p}</span></div>`;
      mapEl.appendChild(w);
      const center = (i)=>{
        const r = dots[i].getBoundingClientRect(), m = mapEl.getBoundingClientRect();
        return { x: r.left - m.left + r.width/2, y: r.top - m.top + r.height/2 };
      };
      requestAnimationFrame(()=>{
        if (!w.isConnected) return;
        const tp = center(target);
        let from = target;
        if (pendingWalk && pendingWalk.route === G.route && target - pendingWalk.from === 1) from = pendingWalk.from;

          requestAnimationFrame(()=>{ w.style.top = tp.y + "px"; });
          setTimeout(()=>{ w.classList.remove("walking"); w.classList.add("idle"); sfxSeat(); w.scrollIntoView({ block:"center", behavior:"smooth" }); }, 1250);   /* 到达节点：落座音 */

        ${cards}
        <div class="card howto"><strong>${t("ui.howTitle")}</strong>
          <ul style="margin:8px 0 0;padding-left:20px;">
            <li>${t("ui.how1")}</li><li>${t("ui.how2")}</li><li>${t("ui.how3")}</li><li>${t("ui.how4")}</li>
          </ul>
        </div>
        ${footerHTML()}`);
      const cpb = $("#cityPickBtn");
      if (cpb) cpb.addEventListener("click", showCityPicker);
      bindLandmarkHit($(".scene"), "7.7%", "17%");
      if (cityBubbleFlash){ cityBubbleFlash = false; flashStartBubble(); }
      app.querySelectorAll("[data-route]").forEach(b=> b.addEventListener("click", ()=> startRun(b.dataset.route)));
      const lb = $("#loginBtn");
      if (lb){
        lb.addEventListener("click", doLogin);
        $("#loginName").addEventListener("keydown", e=>{ if (e.key === "Enter") doLogin(); });
        const lp = $("#loginPass");
        if (lp) lp.addEventListener("keydown", e=>{ if (e.key === "Enter") doLogin(); });
      }
      const lo = $("#logoutBtn");
      if (lo) lo.addEventListener("click", doLogout);
      const ab = $("#avaBtn");
      if (ab) ab.addEventListener("click", ()=> showAvaPick(true));
    }

    /* ---------- 屏幕 2：闯关地图 ---------- */
    function showMap(){
      const route = ROUTES[G.route];
      const routeName = t("routes."+G.route+".name");
      const nodes = route.levels.map((lv, i)=>{
        const d = t("levels."+lv.id);
        const done = i < G.unlocked, now = i === G.unlocked;
        const st = G.stars[lv.id] || 0;
        const stars = done ? `<div class="stars">${"★".repeat(st)}<span class="off">${"★".repeat(3-st)}</span></div>` : "";
        const btn = now ? `<button class="btn" style="width:auto;padding:10px 22px;" data-play="${i}">${t("ui.playLevel")} ▶</button>`
                        : done ? `<button class="btn ghost" style="width:auto;padding:9px 18px;" data-play="${i}">${t("ui.replayLevel")}</button>`
                        : `<div class="small">🔒 ${t("ui.locked")}</div>`;
        return `<div class="node ${done?"done":now?"now":"lock"}">
          <div class="dot">${done?"✅":now?outfitOf(lv.id).a:lv.icon}</div>
          <div class="ninfo"><h4>${i+1}. ${d.name}</h4><p>${d.sub}</p>${stars}${btn}</div>
        </div>`;
      }).join("");
      mount(`${topbarHTML()}${hudHTML()}
        <div class="maphead fadein"><h2>${routeName}${t("ui.mapTitle")}</h2><p>${t("ui.mapSub")}</p></div>
        <div class="isocity" id="isoCity">${citySceneSVG({})}</div>
        <div class="map">${nodes}</div>
        <div style="margin-top:16px;"><button class="btn ghost" id="quitBtn">${t("ui.againRoute")}</button></div>
        ${footerHTML()}`);
      app.querySelectorAll("button[data-play]").forEach(b=> b.addEventListener("click", ()=> startLevel(parseInt(b.dataset.play,10))));
      app.querySelectorAll("#isoCity [data-play]").forEach(g=> g.addEventListener("click", ()=>{ const i = parseInt(g.dataset.play, 10); if (i <= G.unlocked) startLevel(i); }));
      $("#quitBtn").addEventListener("click", showStart);
      bindLandmarkHit($("#isoCity"), "91%", "9%");
      setupCityWalker();
    }

    /* ---------- 屏幕 3：关卡内 ---------- */
    let cur = null; // {li, si}
    function startLevel(li){
      cur = { li, si: 0 };
      const lv = ROUTES[G.route].levels[li];
      G.levelStart = { cash:G.cash, health:G.health, happy:G.happy, age:G.age, year:G.year, score:G.totalScore };
      G.mgScore = 0;
      const d = t("levels."+lv.id);
      const of = outfitOf(lv.id);
      if ((SCENE_KIND[lv.id] || "") === "restaurant") return startRestaurantLevel(li, lv, d, of);
      mount(`${topbarHTML()}${hudHTML()}
        <div class="card fadein">
          <div class="lvlscene">${levelSceneSVG(lv.id)}</div>
          <div class="lvlhead"><span class="ic">${of.a}<span style="font-size:26px;">${of.p}</span></span>
            <span><h2>${li+1}. ${d.name}</h2><p>${d.sub}</p></span></div>
          <div class="goalbox">🎯 ${t("ui.goalLabel")}：${d.goal}</div>
          <button class="btn" id="goBtn">${t("ui.playLevel")} ▶</button>
          <div style="height:10px"></div>
          <button class="btn ghost" id="mapBtn">${t("ui.backMap")}</button>
        </div>`);
      $("#goBtn").addEventListener("click", runStep);
      $("#mapBtn").addEventListener("click", ()=>{ restoreLevelStart(); showMap(); });
    }
    function restoreLevelStart(){
      if (!G.levelStart) return;
      G.cash = G.levelStart.cash; G.health = G.levelStart.health; G.happy = G.levelStart.happy;
      G.age = G.levelStart.age; G.year = G.levelStart.year; G.totalScore = G.levelStart.score;
    }
    function fxChips(fx){
      const names = [t("ui.cash"), t("ui.health"), t("ui.happy")];
      const icons = ["💰","❤️","😊"];
      return fx.map((v,i)=> v!==0 ? `<span class="fx ${v<0?"neg":""}">${icons[i]} ${names[i]} ${v>0?"+":""}${i===0?money(v):v}</span>` : "").join("");
    }
    function statDied(){
      if (G.cash < 0) return "cash";
      if (G.health <= 0) return "health";
      if (G.happy <= 0) return "happy";
      return null;
    }
    function runStep(){
      const lv = ROUTES[G.route].levels[cur.li];
      if (cur.si >= lv.steps.length) return finishLevel();
      const step = lv.steps[cur.si];
      if (step.ev) return showEvent(step.ev);
      if (step.lottery) return showLottery(step);
      if (step.mg === "serve") return showServe(step);
      if (step.mg === "drive") return showDrive(step);
      if (step.mg === "timing") return showTiming(step);
    }
    function afterStep(){
      const dead = statDied();
      if (dead) return failLevel();
      cur.si++;
      runStep();
    }
    function showEvent(evId){
      const e = t("ev."+evId);
      const fx = FX[evId] || [[0,0,0],[0,0,0]];
      const lv = ROUTES[G.route].levels[cur.li];
      const isRest = (SCENE_KIND[lv.id] || "") === "restaurant";
      const sceneHTML = isRest ? dinerStripHTML(lv.id)
        : `<div class="lvlscene evscene">${levelSceneSVG(lv.id)}<div class="poplayer"></div></div>`;
      mount(`${topbarHTML()}${hudHTML()}
        <div class="card fadein">
          ${sceneHTML}
          <p class="evtext">${e.t}</p>
          <div id="choices">${e.c.map((c,i)=>`<button class="choice" data-i="${i}">${c}</button>`).join("")}</div>
          <div id="evResult"></div>
        </div>`);
      app.querySelectorAll(".choice").forEach(b=> b.addEventListener("click", ()=>{
        if (!charge(stepCost("ev"), stepLabel(), true)) return;   // 金币不足：商店已弹出，选项保留
        /* 里程碑专属小旋律：结婚钟声 / 宝宝摇篮曲；其余选择是确认单音（pop 音由 popEventProp 触发） */
        if (evId === "love1") sfxWedding(); else if (evId === "love2") sfxBaby(); else sfxSelect();
        const i = parseInt(b.dataset.i,10), f = fx[i] || [0,0,0];
        G.cash += f[0]; G.health += f[1]; G.happy += f[2]; clampStats();
        popEventProp(isRest, lv.id, evId, i);   // 选中的东西弹跳 pop 到小人面前
        $("#choices").innerHTML = "";
        $("#evResult").innerHTML = `
          <div class="result-note">${e.r[i]}</div>
          <div class="fxline">${fxChips(f)}</div>
          <div style="height:12px"></div>
          <button class="btn" id="contBtn">${t("ui.continueBtn")} ▶</button>`;
        const hud = $(".hud"); if (hud) hud.outerHTML = hudHTML();
        $("#contBtn").addEventListener("click", afterStep);
      }));
    }
    function showLottery(step){
      mount(`${topbarHTML()}${hudHTML()}
        <div class="card fadein center">
          <div style="font-size:52px;">🎰</div>
          <p class="evtext" id="lotText"></p>
          <button class="btn gold" id="lotBtn">${t("ui.lotteryBtn")}</button>
          <div id="lotResult"></div>
        </div>`);
      $("#lotBtn").addEventListener("click", ()=>{
        if (!charge(stepCost("lottery"), stepLabel(), true)) return;   // 金币不足：商店已弹出
        const btn = $("#lotBtn"); btn.disabled = true; btn.textContent = t("ui.lotteryRolling");
        setTimeout(()=>{
          const win = Math.random() < step.chance;
          if (win) sfxGain();   /* 抽奖中奖：叮当庆祝（未中奖走 failLevel 的温和下行音） */
          $("#lotResult").innerHTML = `<div class="result-note">${win ? t("ui.lotteryWin") : t("ui.lotteryLose")}</div>
            <button class="btn" id="lotCont">${win ? t("ui.continueBtn")+" ▶" : t("ui.retryBtn")}</button>`;
          $("#lotCont").addEventListener("click", ()=>{ if (win) afterStep(); else failLevel(true); });
        }, 1100);
      });
    }

    /* ---------- 小游戏公共 ---------- */
    function stopMG(){ if (mgCleanup){ try{ mgCleanup(); }catch(e){} mgCleanup = null; } }
    function mgShell(title, how, inner){
      return `${topbarHTML()}${hudHTML()}
        <div class="card fadein mg"><h3 style="margin:0 0 4px;font-size:18px;">${title}</h3>
        <p class="small" style="margin:0;">${how}</p>${inner}</div>`;
    }

    /* 上菜：点菜 → 点客人 */
    const DISHES = ["🍔","🍜","🍕","🥗","🍗","🍰"];
    const FACES = ["🧑","👩","👴","👦","👱‍♀️","🧔"];
    function showServe(step){
      const cost = stepCost("mg");
      if (!charge(cost, stepLabel(), true)) return stepBlocked(cost);
      const need = step.need || 6;
      let served = 0, selected = null, custs = [], uid = 0, over = false;
      mount(mgShell(t("ui.mgServeTitle"), t("ui.mgServeHow"), `
        <div class="mg-score" id="svScore"></div>
        <div class="customers" id="svCusts"></div>
        <div class="dishrow">${DISHES.map((d,i)=>`<button class="dish" data-d="${i}">${d}</button>`).join("")}</div>
        <div id="svResult"></div>`));
      const scoreEl = $("#svScore"), custEl = $("#svCusts");
      function drawScore(){ scoreEl.textContent = fmt(t("ui.mgServeScore"), {a:served, b:need}); }
      function spawn(){
        if (over || custs.length >= 3) return;
        const c = { id: ++uid, dish: Math.floor(Math.random()*DISHES.length), face: FACES[Math.floor(Math.random()*FACES.length)], pat: 100 };
        custs.push(c);
        const div = document.createElement("div"); div.className = "cust"; div.dataset.id = c.id;
        div.innerHTML = `<span class="face">${c.face}</span><span class="want">${DISHES[c.dish]}</span><span class="patience"><i style="width:100%"></i></span>`;
        div.addEventListener("click", ()=>{
          if (over || selected === null) return;
          if (selected === c.dish){
            served++; G.mgScore += 10; custs = custs.filter(x=>x.id!==c.id); div.remove(); drawScore();
            if (served >= need) return endServe(true);
            spawn();
          } else {
            c.pat = Math.max(5, c.pat - 25);
          }
        });
        custEl.appendChild(div);
      }
      app.querySelectorAll(".dish").forEach(b=> b.addEventListener("click", ()=>{
        selected = parseInt(b.dataset.d,10);
        app.querySelectorAll(".dish").forEach(x=> x.classList.toggle("sel", x===b));
      }));
      const tick = setInterval(()=>{
        if (over) return;
        custs.forEach(c=>{
          c.pat -= 2.2;
          const div = custEl.querySelector(`[data-id="${c.id}"] .patience i`);
          if (div){ div.style.width = Math.max(0,c.pat)+"%"; div.classList.toggle("low", c.pat<35); }
        });
        const gone = custs.find(c=> c.pat <= 0);
        if (gone) return endServe(false);
        if (custs.length < 3 && Math.random() < .3) spawn();
      }, 120);
      const spawner = setInterval(()=>{ if(!over && custs.length<3) spawn(); }, 1600);
      function endServe(win){
        over = true; clearInterval(tick); clearInterval(spawner);
        if (win) sfxGain();   /* 上菜达标：现金入账叮当 */
        G.cash += win ? 180 : 40; G.happy += win ? 4 : -4; clampStats();
        $("#svResult").innerHTML = `<div class="result-note">${win ? t("ui.mgServeDone") : t("ui.mgServeMiss")}</div>
          <div class="fxline">${fxChips([win?180:40,0,win?4:-4])}</div><div style="height:10px"></div>
          <button class="btn" id="svCont">${win ? t("ui.continueBtn")+" ▶" : t("ui.retryBtn")}</button>`;
        $("#svCont").addEventListener("click", ()=>{ if (win) afterStep(); else failLevel(); });
      }
      mgCleanup = ()=>{ clearInterval(tick); clearInterval(spawner); };
      drawScore(); spawn(); spawn();
    }

    /* 开卡车：换道躲障碍 */
    function showDrive(step){
      const cost = stepCost("mg");
      if (!charge(cost, stepLabel(), true)) return stepBlocked(cost);
      const target = step.dist || 500;
      let lane = 1, dist = 0, over = false, obstacles = [];
      mount(mgShell(t("ui.mgDriveTitle"), fmt(t("ui.mgDriveHow"), {b:target}), `
        <div class="mg-score" id="drScore"></div>
        <div class="road" id="drRoad"><div class="truck" id="drTruck">🚛</div></div>
        <div class="laneBtns"><button id="drLeft" aria-label="left">◀️</button><button id="drRight" aria-label="right">▶️</button></div>
        <div id="drResult"></div>`));
      const road = $("#drRoad"), truck = $("#drTruck"), scoreEl = $("#drScore");
      function drawTruck(){ truck.style.left = (lane*33.33)+"%"; }
      function drawScore(){ scoreEl.textContent = fmt(t("ui.mgDriveDist"), {a:Math.min(target,Math.floor(dist)), b:target}); }
      $("#drLeft").addEventListener("click", ()=>{ lane = Math.max(0, lane-1); drawTruck(); });
      $("#drRight").addEventListener("click", ()=>{ lane = Math.min(2, lane+1); drawTruck(); });
      const icons = ["🚗","🚙","🚧","🛢️","🚕"];
      const tick = setInterval(()=>{
        if (over) return;
        dist += 9; drawScore();
        if (Math.random() < .30){
          const o = { lane: Math.floor(Math.random()*3), y: -40, el: document.createElement("div") };
          o.el.className = "obst"; o.el.textContent = icons[Math.floor(Math.random()*icons.length)];
          o.el.style.left = (o.lane*33.33)+"%"; o.el.style.top = "-40px";
          road.appendChild(o.el); obstacles.push(o);
        }
        obstacles.forEach(o=>{ o.y += 7; o.el.style.top = o.y+"px"; });
        obstacles = obstacles.filter(o=>{
          if (o.y > 250 && o.y < 305 && o.lane === lane){ endDrive(false); return false; }
          if (o.y > 345){ o.el.remove(); return false; }
          return true;
        });
        if (dist >= target) endDrive(true);
      }, 100);
      function endDrive(win){
        if (over) return; over = true; clearInterval(tick);
        if (win){ G.mgScore += 30; G.happy += 3; clampStats(); sfxGain(); }   /* 送达：入账叮当 */
        $("#drResult").innerHTML = `<div class="result-note">${win ? t("ui.mgDriveDone") : t("ui.mgDriveCrash")}</div>
          <button class="btn" id="drCont">${win ? t("ui.continueBtn")+" ▶" : t("ui.retryBtn")}</button>`;
        $("#drCont").addEventListener("click", ()=>{ if (win) afterStep(); else failLevel(); });
      }
      mgCleanup = ()=> clearInterval(tick);
      drawTruck(); drawScore();
    }

    /* 射门/投篮：时机条 */
    function showTiming(step){
      const cost = stepCost("mg");
      if (!charge(cost, stepLabel(), true)) return stepBlocked(cost);
      const need = step.need || 2, tries = step.tries || 3;
      let hits = 0, used = 0, pos = 0, dir = 1, over = false;
      mount(mgShell(t("ui.mgTimeTitle"), fmt(t("ui.mgTimeHow"), {a:need, b:tries}), `
        <div class="mg-score" id="tmScore">⚽ ${hits} / ${need}</div>
        <div class="tbar"><div class="tmarker" id="tmMarker"></div></div>
        <div class="tzone-label"><span>✖</span><span>◎</span><span>✖</span></div>
        <button class="btn gold" id="tmBtn" style="font-size:19px;">${t("ui.mgTimeGo")}</button>
        <div id="tmResult"></div>`));
      const marker = $("#tmMarker");
      const tick = setInterval(()=>{
        if (over) return;
        pos += dir * 2.4; if (pos >= 100){ pos = 100; dir = -1; } if (pos <= 0){ pos = 0; dir = 1; }
        marker.style.left = `calc(${pos}% - 3px)`;
      }, 16);
      $("#tmBtn").addEventListener("click", ()=>{
        if (over) return;
        used++;
        const hit = pos >= 44 && pos <= 56;
        if (hit) hits++;
        $("#tmScore").textContent = (hit ? "⚽ " : "💨 ") + hits + " / " + need + " · " + (hit ? t("ui.mgTimeHit") : t("ui.mgTimeMiss"));
        if (hits >= need) return endTiming(true);
        if (used >= tries) return endTiming(false);
      });
      function endTiming(win){
        over = true; clearInterval(tick);
        if (win){ G.mgScore += 25; G.happy += 5; clampStats(); sfxGain(); }   /* 进球：欢呼叮当 */
        $("#tmResult").innerHTML = `<div class="result-note">${win ? fmt(t("ui.mgTimeDone"),{a:hits}) : t("ui.mgTimeFail")}</div>
          <button class="btn" id="tmCont">${win ? t("ui.continueBtn")+" ▶" : t("ui.retryBtn")}</button>`;
        $("#tmCont").addEventListener("click", ()=>{ if (win) afterStep(); else failLevel(); });
      }
      mgCleanup = ()=> clearInterval(tick);
    }

    /* ---------- 关卡结算 / 失败 / 结局 ---------- */
    function failLevel(silentYear){
      stopMG();
      sfxFail();   /* 温和下行音 */
      const lv = ROUTES[G.route].levels[cur.li];
      mount(`${topbarHTML()}${hudHTML()}
        <div class="card fadein center">
          <div style="font-size:52px;">🌧️</div>
          <h2 style="margin:6px 0;">${t("ui.failTitle")}</h2>
          <p class="small">${t("levels."+lv.id+".name")} · ${t("ui.mapSub")}</p>
          <div style="height:8px"></div>
          <button class="btn" id="rtBtn">${t("ui.retryBtn")}</button>
          <div style="height:10px"></div>
          <button class="btn ghost" id="mpBtn">${t("ui.backMap")}</button>
        </div>`);
      $("#rtBtn").addEventListener("click", ()=>{ restoreLevelStart(); startLevel(cur.li); });
      $("#mpBtn").addEventListener("click", ()=>{ restoreLevelStart(); showMap(); });
    }
    function finishLevel(){
      const route = ROUTES[G.route], lv = route.levels[cur.li];
      /* 年度结算：本关收入 + 生活成本 */
      G.cash += lv.part + route.baseCost;
      G.health += (Math.random()*6 - 3);
      clampStats();
      if (statDied()) return failLevel();
      /* 星级：基础 1 星 + 属性健康 1 星 + 小游戏表现 1 星 */
      let stars = 1;
      if (G.health >= 45 && G.happy >= 45) stars++;
      if (G.mgScore >= 25 || lv.steps.every(s=>!s.mg)) stars++;
      stars = Math.min(3, stars);
      const lvlScore = stars*100 + Math.max(0, Math.round(G.mgScore));
      G.totalScore += lvlScore;
      const firstClear = cur.li === G.unlocked;
      if (firstClear){
        pendingWalk = { from: (cur.li === route.levels.length - 1 && cur.li > 0) ? cur.li - 1 : cur.li, route: G.route };
        G.stars[lv.id] = Math.max(G.stars[lv.id]||0, stars);
        G.unlocked++; G.year++; G.age++;
      } else {
        G.stars[lv.id] = Math.max(G.stars[lv.id]||0, stars);
      }
      const isLast = cur.li === route.levels.length - 1;
      sfxWin();   /* 过关小号式上扬旋律 */
      mount(`${topbarHTML()}${hudHTML()}
        <div class="card fadein center">
          <h2 style="margin:2px 0;">🎉 ${t("ui.winTitle")}</h2>
          <div class="bigstars">${"★".repeat(stars)}<span class="off">${"★".repeat(3-stars)}</span></div>
          <p class="small">${t("ui.scoreLabel")}：<strong style="color:var(--ink);font-size:16px;">${lvlScore}</strong></p>
          <div class="fxline" style="justify-content:center;">${fxChips([lv.part + route.baseCost,0,0])}</div>
          <div style="height:12px"></div>
          ${isLast && firstClear
            ? `<button class="btn gold" id="finBtn">🏆 ${t("ui.finalTitle")}</button>`
            : `<button class="btn" id="nxBtn">${t("ui.nextBtn")} ▶</button>
               <div style="height:10px"></div><button class="btn ghost" id="mpBtn2">${t("ui.backMap")}</button>`}
        </div>`);
      if (isLast && firstClear){
        $("#finBtn").addEventListener("click", showEnding);
      } else {
        $("#nxBtn").addEventListener("click", ()=>{ if (cur.li+1 < route.levels.length) startLevel(cur.li+1); else showMap(); });
        $("#mpBtn2").addEventListener("click", showMap);
      }
    }
    function gradeOf(score, cash){
      const total = score + Math.max(0, Math.round(cash/500));
      if (total >= 2400) return ["S", total];
      if (total >= 1900) return ["A", total];
      if (total >= 1400) return ["B", total];
      return ["C", total];
    }
    function showEnding(){
      const years = ROUTES[G.route].levels.length;
      const [grade, total] = gradeOf(G.totalScore, G.cash);
      const routeName = t("routes."+G.route+".name");
      const line = t("ui.endLines."+grade);
      const endText = t("endings."+G.route);
      const shareText = avatarDef().person + " " + gameName() + "\n" + t("ui.shareHead") + "\n" +
        fmt(t("shareTpl"), { route: routeName, years, cash: money(G.cash).replace("$",""), grade, score: total, line: endText });
      mount(`${topbarHTML()}${hudHTML()}
        <div class="card fadein">
          <h2 class="center" style="margin:0;">${t("ui.finalTitle")}</h2>
          <div class="grade disp">${grade}</div>
          <p class="summary-line"><strong>${line}</strong>\n${endText}</p>
          <div class="hud-row">
            <div class="stat"><div class="k">🏆 ${t("ui.finalScore")}</div><div class="v">${total}</div></div>
            <div class="stat"><div class="k">💰 ${t("ui.cash")}</div><div class="v">${money(G.cash)}</div></div>
            <div class="stat"><div class="k">⏱</div><div class="v">${years} ${t("ui.years")}</div></div>
          </div>
          <div class="sharebox" id="shareText">${shareText}</div>
          <button class="btn gold" id="cpBtn">${t("ui.shareBtn")}</button>
          <div style="height:10px"></div>
          <div class="btnrow">
            <button class="btn" id="agBtn">${t("ui.sameRoute")}</button>
            <button class="btn ghost" id="othBtn">${t("ui.tryOther")}</button>
          </div>
        </div>
        <div class="mapbanner">${cityBannerSVG()}</div>
        ${footerHTML()}`);
      bindLandmarkHit($(".mapbanner"), "87%", "45%");
      $("#cpBtn").addEventListener("click", async ()=>{
        const txt = $("#shareText").textContent;
        try { await navigator.clipboard.writeText(txt); toast(t("ui.copied")); }
        catch(e){
          const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta);
          ta.select(); try{ document.execCommand("copy"); toast(t("ui.copied")); }catch(_){ } ta.remove();
        }
      });
      $("#agBtn").addEventListener("click", ()=>{ const r = G.route; startRun(r); if (!G) showStart(); });
      $("#othBtn").addEventListener("click", showStart);
    }

    /* ---------------- 语言：自动识别 + 手动切换记忆 ---------------- */
    function detectLang(){
      try {
        const saved = localStorage.getItem("usa-life-lang");
        if (saved && LANGS[saved]) return saved;
      } catch(e){}
      const navs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "en"];
      for (const n of navs){
        const code = String(n).toLowerCase().split("-")[0];
        if (LANGS[code]) return code;
      }
      return "en";
    }
    function updateDocTitle(){
      document.title = LANG === "zh" ? "移民美国 · 在美国生活 | American Life" : (gameName() === "American Life" ? "American Life" : gameName() + " | American Life");
    }
    function setLang(code){
      if (!LANGS[code]) return;
      LANG = code;
      document.documentElement.lang = LANGS[code].htmlLang;
      updateDocTitle();
      try { localStorage.setItem("usa-life-lang", code); } catch(e){}
      /* 在当前屏幕重渲染 */
      if (!G) showStart();
      else if (cur && $("#app .card")) { /* 关卡进行中：回到地图避免丢失进度 */ restoreLevelStart(); cur = null; showMap(); }
      else showMap();
    }
    function init(){
      loadAcc();
      loadW();
      try { const c = localStorage.getItem("usa-life-city"); if (c && CITIES[c]) CITY = c; } catch(e){}
      LANG = detectLang();
      document.documentElement.lang = LANGS[LANG].htmlLang;
      updateDocTitle();
      /* 全局：任何 [data-shop] 按钮打开金币商店（含 HUD 的 + 按钮、拦截屏、钱包卡） */
      document.addEventListener("click", (e)=>{
        const b = e.target && e.target.closest ? e.target.closest("[data-shop]") : null;
        if (b) showShop();
      });
      /* 声音：每一次点按都唤醒（恢复被 iOS 挂起的 AudioContext + 确保 BGM 在播），不只首次 */
      document.addEventListener("pointerdown", sndWake);
      document.addEventListener("click", sndWake);
      /* 切回前台时也尝试恢复播放（BGM 元素已解锁过，系统一般允许续播） */
      document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) sndWake(); });
      /* 点按轻 tick（声音开关 / 试听 / 选城 / 买币按钮有各自的音效，不重复） */
      document.addEventListener("click", (e)=>{
        const el = e.target && e.target.closest ? e.target.closest("button, [data-play]") : null;
        if (el && el.id !== "sndBtn" && el.id !== "sndTryBtn" && !el.hasAttribute("data-pick") && !el.hasAttribute("data-buy")) sfxTick();
      });
      showStart();
    }
    init();
    </script>
  </body>
</html>
