<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>移民美国 · 在美国生活 | American Life</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Sans:wght@400;600;700;900&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root{
        --bg:#f6f1e7; --bg2:#efe6d4; --card:#fffdf8; --ink:#21304a; --ink-soft:#5a6a86;
        --line:#e3d9c4; --accent:#c8402a; --accent-ink:#fff;
        --gold:#e9a13b; --gold-soft:#fbeed3; --green:#2e7d4f; --green-soft:#e2f1e6;
        --blue:#2456a6; --blue-soft:#e3ecfa; --red-soft:#fbe7e1;
        --sky:#ffd98a; --sky2:#ff9d5c; --road:#3c4658; --shadow:0 10px 30px rgba(33,48,74,.14);
        --radius:18px;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#131a29; --bg2:#0e1420; --card:#1d2739; --ink:#eef2fa; --ink-soft:#a7b4cc;
          --line:#33405a; --accent:#e2573f; --gold-soft:#3d2f16; --green-soft:#173527;
          --blue-soft:#1b2c4d; --red-soft:#3d2019; --sky:#f2a950; --sky2:#b8562f; --road:#0b0f16;
          --shadow:0 10px 30px rgba(0,0,0,.45);
        }
      }
      *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
      html,body{margin:0;padding:0;}
      body{
        font-family:"Noto Sans SC","Noto Sans","Noto Sans Devanagari",system-ui,sans-serif;
        background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
        color:var(--ink); min-height:100vh;
      }
      .disp{font-family:"Baloo 2","Noto Sans SC","Noto Sans",sans-serif;}
      #app{max-width:520px;margin:0 auto;padding:0 14px 48px;}

      /* ---------- top bar ---------- */
      .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 2px 6px;flex-wrap:wrap;}
      .brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:17px;letter-spacing:.2px;}
      .brand .flag{font-size:22px;}
      .langwrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
      .langwrap label{font-size:12px;color:var(--ink-soft);font-weight:700;}
      #langSel{
        font:inherit;font-size:14px;font-weight:700;color:var(--ink);
        background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 10px;cursor:pointer;
      }

      /* ---------- street scene ---------- */
      .scene{position:relative;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);margin-top:8px;}
      .scene svg{display:block;width:100%;height:auto;}
      .scene .cap{
        position:static;background:#21304a;padding:16px 18px 17px;color:#fff;
      }
      .scene .cap h1{margin:0;font-size:27px;line-height:1.15;font-weight:900;}
      .scene .cap p{margin:6px 0 0;font-size:14px;opacity:.92;line-height:1.5;}
      @media (max-width:560px){
        .scene .cap{padding:14px 16px 16px;}
        .scene .cap h1{font-size:21px;}
        .scene .cap p{font-size:13px;}
      }

      /* ---------- HUD ---------- */
      .hud{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(8px);padding:8px 0 10px;}
      .hud-row{display:flex;gap:8px;flex-wrap:wrap;}
      .stat{flex:1 1 0;min-width:70px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:7px 9px;}
      .stat .k{font-size:11px;color:var(--ink-soft);font-weight:700;display:flex;gap:4px;align-items:center;}
      .stat .v{font-size:16px;font-weight:900;margin-top:1px;}
      .stat .v.neg{color:var(--accent);}
      .bar{height:6px;border-radius:99px;background:var(--line);margin-top:5px;overflow:hidden;}
      .bar i{display:block;height:100%;border-radius:99px;transition:width .5s ease;}
      .bar .h{background:#d94f3d;} .bar .p{background:var(--gold);}
      .hud-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;font-weight:700;color:var(--ink-soft);}
      .statuschip{background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:800;}
      @media (prefers-color-scheme: dark){ .statuschip{color:#9dc0ff;} }

      /* ---------- generic cards & buttons ---------- */
      .card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
      .btn{
        display:block;width:100%;border:none;cursor:pointer;font:inherit;font-weight:800;font-size:16.5px;
        background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:15px 16px;text-align:center;
        box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .06s ease, box-shadow .06s ease;
      }
      .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18);}
      .btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none;}
      .btn.blue{background:var(--blue);}
      .btn.gold{background:var(--gold);color:#3a2703;}
      .btn:disabled{opacity:.45;cursor:not-allowed;}
      .btnrow{display:flex;gap:10px;} .btnrow .btn{flex:1;}
      .small{font-size:13px;color:var(--ink-soft);line-height:1.6;}
      .center{text-align:center;}

      /* ---------- route select ---------- */
      .q-title{font-size:24px;font-weight:900;text-align:center;margin:22px 6px 4px;line-height:1.3;}
      .q-sub{text-align:center;color:var(--ink-soft);font-size:14px;margin:0 6px 16px;line-height:1.55;}
      .route{
        display:flex;gap:14px;align-items:flex-start;width:100%;text-align:start;cursor:pointer;font:inherit;
        background:var(--card);border:2.5px solid var(--line);border-radius:20px;padding:16px;margin:0 0 14px;
        box-shadow:var(--shadow);transition:border-color .15s ease, transform .1s ease;color:var(--ink);
      }
      .route:active{transform:scale(.985);}
      .route:hover{border-color:var(--gold);}
      .route .ric{font-size:42px;line-height:1;flex:0 0 auto;}
      .route h3{margin:0 0 4px;font-size:19px;font-weight:900;}
      .route p{margin:0;font-size:13.5px;color:var(--ink-soft);line-height:1.55;}
      .route .tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
      .tag{font-size:11.5px;font-weight:800;background:var(--gold-soft);color:#8a5a12;border-radius:999px;padding:3px 9px;}
      @media (prefers-color-scheme: dark){ .tag{color:var(--gold);} }
      .howto{margin-top:4px;}
      .howto li{margin:5px 0;font-size:14px;line-height:1.55;}

      /* ---------- map ---------- */
      .maphead{margin:14px 2px 4px;}
      .maphead h2{margin:0;font-size:21px;font-weight:900;}
      .maphead p{margin:4px 0 0;font-size:13.5px;color:var(--ink-soft);line-height:1.55;}
      .map{position:relative;margin:18px 0 6px;padding-left:8px;}
      .map::before{content:"";position:absolute;left:35px;top:16px;bottom:16px;width:4px;border-radius:99px;
        background:repeating-linear-gradient(180deg,var(--gold) 0 12px,transparent 12px 22px);opacity:.75;}
      .node{display:flex;gap:14px;align-items:flex-start;position:relative;padding:10px 0;}
      .node .dot{
        flex:0 0 auto;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;
        font-size:27px;background:var(--card);border:3px solid var(--line);z-index:1;box-shadow:var(--shadow);
      }
      .node.done .dot{border-color:var(--green);background:var(--green-soft);}
      .node.now .dot{border-color:var(--accent);background:var(--red-soft);animation:pulse 1.6s infinite;}
      @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,64,42,.35);}70%{box-shadow:0 0 0 12px rgba(200,64,42,0);}100%{box-shadow:0 0 0 0 rgba(200,64,42,0);}}
      .node.lock{opacity:.48;}
      .node .ninfo{flex:1;padding-top:5px;}
      .node .ninfo h4{margin:0;font-size:16.5px;font-weight:900;}
      .node .ninfo p{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
      .stars{color:var(--gold);font-size:14px;letter-spacing:2px;margin-top:2px;}
      .stars .off{color:var(--line);}
      .node button{margin-top:8px;}

      /* ---------- visual layer: scenes / walker / city ---------- */
      .lvlscene{border-radius:14px;overflow:hidden;margin:0 0 14px;box-shadow:0 6px 18px rgba(33,48,74,.16);line-height:0;}
      .lvlscene svg{width:100%;height:auto;}
      .mapbanner{border-radius:16px;overflow:hidden;margin:10px 0 2px;box-shadow:var(--shadow);line-height:0;}
      .mapbanner svg{width:100%;height:auto;}
      .walker{position:absolute;width:60px;height:60px;transform:translate(-50%,-50%);z-index:6;pointer-events:none;transition:top 1.15s cubic-bezier(.45,.05,.35,1);}
      .walker .win{position:relative;width:60px;height:60px;border-radius:50%;background:var(--card);border:3px solid var(--accent);box-shadow:0 0 0 5px rgba(233,161,59,.35),0 8px 18px rgba(20,26,40,.28);display:flex;align-items:center;justify-content:center;}
      .walker .wava{font-size:29px;line-height:1;}
      .walker .wprop{position:absolute;right:-5px;bottom:-5px;width:24px;height:24px;font-size:14px;background:var(--card);border:2px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;}
      .walker.walking .win{animation:walkbob .26s ease-in-out infinite alternate;}
      .walker.idle .win{animation:idlebob 2.6s ease-in-out infinite;}
      @keyframes walkbob{from{transform:translateY(0) rotate(-3deg);}to{transform:translateY(-6px) rotate(3deg);}}
      @keyframes idlebob{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
      .citypick{margin:0 0 4px;}
      .cityq{font-size:14.5px;font-weight:900;margin:0 2px 8px;}
      .citychips{display:flex;gap:8px;flex-wrap:wrap;}
      .citychip{font:inherit;font-size:13.5px;font-weight:800;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer;}
      .citychip.sel{border-color:var(--accent);background:var(--red-soft);}
      /* 声音开关（顶栏） */
      .sndbtn{font:inherit;font-size:16px;line-height:1;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer;}
      .sndbtn:active{border-color:var(--gold);}
      .sndtry{font-size:13px;font-weight:700;padding:6px 9px;white-space:nowrap;}
      /* 选城按钮 + pop-up 城市列表 */
      .citypickbtn{display:flex;align-items:center;gap:11px;width:100%;font:inherit;text-align:start;cursor:pointer;color:var(--ink);background:var(--card);border:2.5px solid var(--line);border-radius:16px;padding:11px 14px;box-shadow:var(--shadow);}
      .citypickbtn:active{border-color:var(--gold);}
      .citypickbtn .cpicon{font-size:30px;line-height:1;}
      .citypickbtn .cpname{font-size:17px;font-weight:900;}
      .citypickbtn .cpmore{margin-left:auto;font-size:13px;font-weight:800;color:var(--blue);white-space:nowrap;}
      .citylist{max-height:54vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px;}
      .cityrow{display:flex;gap:12px;align-items:center;width:100%;text-align:start;font:inherit;cursor:pointer;color:var(--ink);background:var(--bg);border:2.5px solid var(--line);border-radius:14px;padding:10px 12px;}
      @media (prefers-color-scheme: dark){ .cityrow{background:var(--bg2);} }
      .cityrow.sel{border-color:var(--accent);background:var(--red-soft);}
      .cityrow .cicon{font-size:32px;line-height:1;flex:0 0 auto;}
      .cityrow .ctext2{flex:1;min-width:0;}
      .cityrow .ctext2 h4{margin:0;font-size:16px;font-weight:900;}
      .cityrow .ctext2 p{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft);line-height:1.45;}
      .cityrow .cyear{flex:0 0 auto;font-size:11.5px;font-weight:800;background:var(--gold-soft);color:#8a5a12;border-radius:999px;padding:3px 9px;}
      @media (prefers-color-scheme: dark){ .cityrow .cyear{color:var(--gold);} }
      /* 城市文化气泡（小人旁一句话，可点开名片） */
      .citybubble{position:absolute;z-index:12;max-width:238px;font:inherit;text-align:start;cursor:pointer;background:var(--card);color:var(--ink);border:2px solid var(--gold);border-radius:14px;padding:9px 12px 8px;box-shadow:var(--shadow);transform:translate(-50%,-118%);animation:bubbleIn .35s ease both;}
      .citybubble .cbtx{display:block;font-size:13px;font-weight:700;line-height:1.55;}
      .citybubble .cbhint{display:block;margin-top:4px;font-size:11px;font-weight:800;color:var(--blue);}
      .citybubble::after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border:9px solid transparent;border-top-color:var(--gold);border-bottom:none;}
      .citybubble.out{opacity:0;transition:opacity .4s ease;}
      @keyframes bubbleIn{from{opacity:0;transform:translate(-50%,-96%) scale(.85);}to{opacity:1;transform:translate(-50%,-118%) scale(1);}}
      .citybubble.bub-b{transform:translate(-50%,16%);animation:bubbleInB .35s ease both;}
      .citybubble.bub-b::after{bottom:auto;top:-9px;border-top:none;border-bottom:9px solid var(--gold);}
      @keyframes bubbleInB{from{opacity:0;transform:translate(-50%,-4%) scale(.85);}to{opacity:1;transform:translate(-50%,16%) scale(1);}}
      /* 地标点击热区（点开城市名片） */
      .lmhit{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:transparent;border:none;cursor:pointer;z-index:11;padding:0;}
      /* 城市名片 */
      .citycard .cc-head{display:flex;align-items:center;gap:11px;margin:0 34px 8px 0;}
      .citycard .cc-head .cc-icon{font-size:38px;line-height:1;}
      .citycard .cc-head h3{margin:0;font-size:21px;}
      .citycard .cc-line{font-size:14.5px;line-height:1.65;color:var(--ink);margin:0 0 8px;white-space:normal;}
      .citycard .cc-poem{font-size:15px;line-height:1.65;font-style:italic;color:var(--ink-soft);background:var(--gold-soft);border-radius:12px;padding:10px 13px;margin:0 0 10px;}

      /* ---------- 2.5D 等距模块化城市 ---------- */
      .isocity{position:relative;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);line-height:0;margin:10px 0 2px;background:#8fd2ff;}
      .isocity svg{width:100%;height:auto;display:block;}
      .isocity .nowpulse{fill:none;stroke:#e9a13b;stroke-width:3;animation:npulse 1.6s ease-out infinite;}
      @keyframes npulse{0%{opacity:.95;r:13px;}100%{opacity:0;r:25px;}}
      .dinerset{transform:scale(0);transform-box:fill-box;transform-origin:50% 100%;transition:transform .5s cubic-bezier(.2,2.1,.4,1);}
      .dinerset.on{transform:scale(1);}
      /* 城市小人：所选头像 + 身体 + 随身道具，沿街道走 / 跑、朝向翻转 */
      .walker2{position:absolute;width:46px;height:58px;transform:translate(-50%,-94%);z-index:8;pointer-events:none;line-height:1;}
      .walker2 .w2bob{position:relative;width:100%;height:100%;}
      .walker2.walking .w2bob{animation:walkbob .22s ease-in-out infinite alternate;}
      .walker2.idle .w2bob{animation:idlebob 2.6s ease-in-out infinite;}
      .walker2 .w2flip{position:absolute;inset:0;}
      .walker2 .w2face{position:absolute;left:50%;top:0;transform:translateX(-50%);font-size:29px;z-index:2;filter:drop-shadow(0 2px 2px rgba(20,26,40,.3));}
      .walker2 .w2torso{position:absolute;left:50%;top:27px;transform:translateX(-50%);width:22px;height:19px;border-radius:9px 9px 5px 5px;background:var(--accent);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18);}
      .walker2 .w2torso::before,.walker2 .w2torso::after{content:"";position:absolute;bottom:-8px;width:6px;height:9px;border-radius:3px;background:#31405e;transform-origin:top center;}
      .walker2 .w2torso::before{left:3px;}
      .walker2 .w2torso::after{right:3px;}
      .walker2.walking .w2torso::before{animation:legswing .18s ease-in-out infinite alternate;}
      .walker2.walking .w2torso::after{animation:legswing .18s ease-in-out infinite alternate-reverse;}
      @keyframes legswing{from{transform:rotate(26deg);}to{transform:rotate(-26deg);}}
      .walker2 .w2prop{position:absolute;right:-4px;top:19px;width:22px;height:22px;font-size:13px;background:var(--card);border:2px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:3;}
      .walker2.seated{transform:translate(-50%,-86%);}
      .walker2.seated .w2torso{height:11px;}
      .walker2.seated .w2torso::before,.walker2.seated .w2torso::after{display:none;}
      /* 道具 / 食物 pop：弹跳蹦出落位 */
      .popitem{position:absolute;transform:translate(-50%,-100%);z-index:9;pointer-events:none;line-height:1;filter:drop-shadow(0 6px 6px rgba(20,26,40,.35));animation:popSpring .8s cubic-bezier(.2,2.2,.4,1) both;transition:opacity .3s ease;}
      .popitem.out{opacity:0;}
      @keyframes popSpring{
        0%{transform:translate(-50%,-30%) scale(0) rotate(-16deg);}
        45%{transform:translate(-50%,-122%) scale(1.3) rotate(6deg);}
        65%{transform:translate(-50%,-94%) scale(.93) rotate(-2deg);}
        82%{transform:translate(-50%,-105%) scale(1.07);}
        100%{transform:translate(-50%,-100%) scale(1) rotate(0deg);}
      }
      .poplayer{position:absolute;inset:0;pointer-events:none;}
      .evscene{position:relative;}
      /* 餐馆关事件小景：小人坐在露天桌边 */
      .diner{position:relative;height:108px;border-radius:14px;overflow:hidden;margin:0 0 14px;box-shadow:0 6px 18px rgba(33,48,74,.16);background:linear-gradient(180deg,#565aa8 0%,#c86b9d 50%,#ffb37a 72%,#6b4a2e 72.5%,#54381f 100%);}
      .diner-sign{position:absolute;right:10px;top:9px;width:40px;height:40px;font-size:21px;background:rgba(255,253,248,.94);border:2px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;}
      .dchar{position:absolute;left:24%;bottom:6px;width:58px;height:76px;}
      .dchar .dchair{position:absolute;left:-8px;bottom:0;font-size:42px;}
      .dchar .dface{position:absolute;left:9px;top:0;font-size:35px;z-index:2;filter:drop-shadow(0 2px 2px rgba(20,26,40,.3));}
      .dchar .dtorso{position:absolute;left:18px;top:37px;width:25px;height:19px;border-radius:9px 9px 4px 4px;background:var(--accent);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18);z-index:1;}
      .dchar .dprop{position:absolute;right:-9px;top:29px;width:23px;height:23px;font-size:13px;background:var(--card);border:2px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:3;}
      .dtable{position:absolute;left:53%;bottom:15px;width:86px;height:13px;border-radius:50%;background:#a06a28;}
      .dtable::after{content:"";position:absolute;left:50%;top:9px;width:6px;height:17px;margin-left:-3px;background:#7a4e16;border-radius:0 0 3px 3px;}
      /* 第一餐选项 */
      .mealzone{margin:2px 0 14px;}
      .mealq{font-size:15.5px;font-weight:800;margin:0 0 10px;line-height:1.55;}
      .foodrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
      @media (max-width:380px){ .foodrow{grid-template-columns:repeat(2,1fr);} }
      .foodbtn{font:inherit;cursor:pointer;background:var(--card);border:2.5px solid var(--line);border-radius:14px;padding:9px 4px 8px;font-size:12.5px;font-weight:800;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px;transition:border-color .12s ease, transform .08s ease;}
      .foodbtn span{font-size:30px;line-height:1.1;}
      .foodbtn:active{transform:scale(.95);}
      .foodbtn.sel{border-color:var(--accent);background:var(--red-soft);}
      .mealnote{font-size:14px;line-height:1.6;background:var(--gold-soft);border-radius:12px;padding:10px 13px;margin-top:10px;}
      .mealnote:empty{display:none;}

      /* ---------- level play ---------- */
      .lvlhead{display:flex;gap:12px;align-items:center;margin:14px 0 12px;}
      .lvlhead .ic{font-size:40px;}
      .lvlhead h2{margin:0;font-size:21px;font-weight:900;line-height:1.25;}
      .lvlhead p{margin:3px 0 0;font-size:13px;color:var(--ink-soft);line-height:1.5;}
      .goalbox{background:var(--blue-soft);border-radius:14px;padding:11px 14px;font-size:13.5px;font-weight:700;color:var(--blue);margin-bottom:14px;line-height:1.55;}
      @media (prefers-color-scheme: dark){ .goalbox{color:#9dc0ff;} }
      .evtext{font-size:16.5px;line-height:1.75;margin:2px 0 14px;white-space:pre-line;}
      .choice{
        display:block;width:100%;text-align:start;font:inherit;cursor:pointer;margin:0 0 10px;
        background:var(--card);border:2.5px solid var(--line);border-radius:14px;padding:14px 15px;
        font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.5;transition:border-color .12s ease;
      }

        w5:{name:"长途卡车关", sub:"一个人的美国公路", goal:"开大卡车跑长途（驾驶小游戏），把钱挣回来。"},
        w6:{name:"身份关", sub:"把身份问题解决掉", goal:"通过雇主担保等正规途径，把身份办下来。"},
        w7:{name:"买房关", sub:"有个自己的窝", goal:"攒够首付，买下属于自己的房子。"},
        w8:{name:"扎根关", sub:"入籍，安家，岁月静好", goal:"入籍宣誓，打工路大结局！"},
        i1:{name:"选址开店关", sub:"位置决定生死", goal:"选好店址、签下租约，把开店的钱花在刀刃上。"},
        i2:{name:"开餐馆关", sub:"开业大吉，手忙脚乱", goal:"亲自下场帮厨上菜（上菜小游戏），把开业高峰扛过去。"},
        i3:{name:"卫生检查关", sub:"检查员突然到访", goal:"通过卫生检查，别让差评毁了口碑。"},
        i4:{name:"经营扩张关", sub:"口碑、回头客、第二家店", goal:"稳住经营，冲一冲规模。"},
        i5:{name:"身份关", sub:"投资移民流程", goal:"走完投资移民流程，拿到绿卡。"},
        i6:{name:"买房安家关", sub:"事业稳了，把家安下", goal:"买房安家，家人团聚。"},
        i7:{name:"扎根关", sub:"入籍，从老板到邻居", goal:"入籍宣誓，投资路大结局！"}

      ev:{
        s1e1:{t:"语言班开学第一天，老师语速快得像说唱。你坐在最后一排，一句没听懂。",c:["下课追上去请老师慢点讲，还加了同学微信组学习小组","算了，靠自己刷题，省点社交的力气"],r:["老师被你的认真打动，额外给了你一堆备考资料。","你刷题很拼，但口语一直没人练，心里有点慌。"]},
        s1e2:{t:"室友天天开派对，厨房永远飘着披萨香。你的托福模考还差 5 分。",c:["加入派对，周末再补课——快乐也是生产力","婉拒派对，今晚把听力刷完"],r:["派对上你认识了几个外国朋友，口语突飞猛进。","听力刷完了，分数稳了，就是有点想家。"]},
        s1e3:{t:"考试前一周，你妈打来视频电话，说家里一切都好，让你别省钱。挂了电话你看着账户余额叹了口气。",c:["报一个冲刺班，贵就贵点，一次过最重要","自己复习，把钱留着交学费"],r:["冲刺班押中了题型，你发挥稳定。","省钱归省钱，考场上你手心全是汗。"]},
        s2e1:{t:"选校时间到。名校学费贵得吓人，普通学校又怕不够「出息」。中介说：申得好不如申得巧。",c:["冲名校！人生难得几回搏","稳妥搭配：两所冲刺、两所保底"],r:["申请费刷出去一截，但梦校的海报你贴在了墙上。","搭配很合理，中介都夸你清醒。"]},
        s2e2:{t:"文书要写「你为什么想来美国」。你盯着空白文档坐了一下午。",c:["写奶奶的故事：她总说，读书能走得更远","找模板，东拼西凑一篇「标准答案」"],r:["你写着写着哭了，又笑着改完——这篇文书特别真诚。","文书是写完了，但读起来像谁的故事都行。"]},
        s2e3:{t:"录取信陆续到了！一所排名高但没奖学金，一所排名一般但给了半奖。",c:["去排名高的，咬牙读，毕业赚回来","去给半奖的，经济压力小一半"],r:["你把录取信截图发到家庭群，全家沸腾。","半奖让你爸妈肩上的担子轻了很多。"]},
        s3e1:{t:"签证面试当天，领事馆门口排起长队。前面一个小伙子垂头丧气地出来了。",c:["深呼吸，默念准备好的答案，轮到自己坦然上前","越想越紧张，手心冒汗"],r:["签证官问的问题你都准备过，回答得很稳。","轮到你时腿有点抖，但材料齐全。"]},
        s3e2:{t:"签证官突然问：「毕业后你打算留在美国吗？」——这是道送命题。",c:["如实说：想先在美国工作几年积累经验，也想念家乡，会按规定走每一步","斩钉截铁：绝对不留！毕业马上回国！"],r:["签证官抬头看了你一眼，点点头，在键盘上敲了几下。诚实加分。","说得太用力，签证官反而皱了下眉——不过材料过硬，还是给你过了。"]},
        s4e1:{t:"飞机落地，你拖着两个大箱子站在机场。接机的学长说：「欢迎来到美国，先请你吃顿汉堡。」",c:["踏实了——今晚睡个好觉，明天开始新生活","兴奋得睡不着，连夜把周边逛了一圈"],r:["一觉醒来神清气爽，新生活开始了。","逛到半夜，第二天顶着黑眼圈去办手续。"]},
        s4e2:{t:"租房合同全是英文，押金要两个月房租。合租的室友说厕所永远有人。",c:["签！离学校近最重要，押金咬咬牙","再找找，远一点但便宜一半"],r:["住得近，每天多睡一小时，值。","通勤远了点，但省下的钱够吃一个月。"]},
        s4e3:{t:"你在校园餐吧找到兼职。经理说：忙起来像打仗，你行吗？",c:["行！我手脚麻利——开始上菜挑战","先试一天再说"],r:["那就看你的了！","试一天也是干，撸起袖子吧。"]},
        s5e1:{t:"期中考试周，图书馆通宵开放。你的室友已经在桌子上睡着了。教授说这门课挂科率 30%。",c:["组学习小组，抱团取暖一起复习","咖啡续命，一个人硬扛"],r:["小组里的大神画了重点，全组都受益。","你扛住了，就是头发又少了几根。"]},
        s5e2:{t:"你选的编程课，大作业是要做一个能跑的小网站。你卡在一个 bug 上两天了。",c:["去 office hour 问教授，顺便混个脸熟","自己死磕，查文档查到天亮"],r:["教授三句话点通你，还夸你问题问得好。","bug 凌晨四点修好了，你对着屏幕傻笑。"]},
        s5e3:{t:"感恩节假期，本地同学邀请你去家里吃饭。桌上有只巨大的烤火鸡。",c:["去！带一盘自己做的饺子当伴手礼","婉拒，在宿舍煮泡面赶作业"],r:["饺子被一抢而空，你还被邀请圣诞节再来。美国的家，也能有你的位置。","泡面吃完了，作业也赶完了，就是有点孤单。"]},
        s6e1:{t:"毕业季，招聘会现场人山人海。你的简历投出去 80 份，回音寥寥。",c:["改简历、练面试、请学长内推，多管齐下","先降低标准，有工作再说"],r:["内推起了作用，你拿到了三场面试。","心态稳住，好消息在路上。"]},
        s6e2:{t:"终面结束，工程师主管说：「你的技术没问题。」一周后，offer 邮件躺在收件箱里——年薪数字让你揉了揉眼睛。",c:["签！第一份工作，先上车","再等等另一家的结果"],r:["你把 offer 转发给爸妈，配文：我做到了。","等待是煎熬的，但你想要一个更好的开始。"]},
        s6e3:{t:"入职前最后一个周末，朋友拉你去踢野球/打篮球放松。",c:["去！站上球场，一脚定乾坤","在家补觉，养精蓄锐"],r:["球场见真章——活动活动筋骨！","睡了个昏天黑地，满血复活。"]},
        s7e1:{t:"公司帮你提交了 H-1B 抽签申请。每年几十万人抢几万个名额，中签率全看命。办公室里所有人都在转发锦鲤。",c:["转发锦鲤，深呼吸，点下抽签","佛系等待，结果出来再说"],r:["命运的按钮已经按下……","该吃吃该睡睡，听天由命。"]},
        s8e1:{t:"中签后是漫长的绿卡排期。律师说：材料要一份份备齐，急不得。",c:["按部就班备材料，周末去考个证充实自己","天天刷排期表，越刷越焦虑"],r:["日子充实起来，排期反而过得快。","焦虑解决不了排期，但把你睡眠解决了——睡不好。"]},
        s8e2:{t:"排期等了两年，你升职了，也搬进了更好的公寓。窗外是城市的灯火，你忽然想起刚下飞机那晚。",c:["给家里打个长电话，报喜不报忧","约朋友吃顿好的，纪念一下"],r:["妈妈在电话那头笑中带泪：我闺女/儿子出息了。","这顿饭吃的是这些年的不容易。"]},
        s8e3:{t:"绿卡批准通知到了！那张绿色的小卡片，你等了它整整好几年。",c:["小心翼翼收进钱包最里层","当晚请所有帮过你的人吃饭"],r:["从今天起，你是永久居民了。","这一桌人，就是你在美国的家人。"]},
        s9e1:{t:"入籍考试要考美国历史：第一任总统是谁？宪法第一修正案说什么？你把一百道题背得滚瓜烂熟。",c:["胸有成竹走进考场","紧张到把华盛顿说成林肯（又赶紧改口）"],r:["考官微笑着合上文件夹：「恭喜你。」","虚惊一场，最后还是全对了。"]},
        s9e2:{t:"宣誓仪式上，你举起右手，跟着念誓词。周围是来自几十个国家的新公民，有人哭，有人笑，有人抱着孩子。",c:["你也红了眼眶——这一路，值了","笑着挥手：从今天起，这是我的国家了"],r:["走出礼堂，阳光正好。你在美国的故事，才刚刚开始。","大结局！但你知道，人生的下一章更精彩。"]},
        w1e1:{t:"你带着两个行李箱和一口袋现金落地美国。英语只会说「Hello」和「Thank you」。当晚住进合租地下室，一张床垫 $300/月。",c:["不挑，先住下，活下来最重要","咬咬牙住好点的，休息好才能干活"],r:["地下室有点潮，但便宜就是硬道理。","房间亮堂，你睡了落地后第一个好觉。"]},
        w1e2:{t:"老乡介绍你去中餐馆打黑工：一天 11 小时，现金工资。老板说：先干着，管吃管住。",c:["干！先有收入再说","再找找，看有没有正规点的活"],r:["第一天干完，腰酸背痛，但兜里有了第一笔美国收入。","找了两天，差点断粮，还是回了餐馆——先上车再说。"]},
        w1e3:{t:"发工资那天，老板少给了 $100，说是「培训费」。工友劝你忍忍。",c:["当面把账算清楚：干了多少小时就是多少钱","忍了，下个月再看"],r:["老板嘟囔着补上了钱，还对你多了点尊重。","钱没要回来，你把这笔账记在了心里。"]},
        w2e1:{t:"你正式成了餐馆服务员。领班说：小费就是你的命，笑脸就是你的武器。",c:["把菜单背熟，练好英文点单——开始上菜挑战","先干起来，边干边学"],r:["客人马上就进门了，准备好！","手忙脚乱的第一天，开始。"]},
        w2e2:{t:"一位老太太每週都来，总点同一道菜，临走总多给小费，说你让她想起自己的孙子。",c:["记住她的口味，她一进门就备好茶","微笑服务，一视同仁"],r:["老太太把你介绍给半条街的人，小费涨了一截。","你的笑脸成了店里的招牌之一。"]},
        w3e1:{t:"干了大半年，你的存款第一次突破 $5,000。工友约你去赌场「翻倍」，还有人拉你买「稳赚」的币。",c:["不去！这钱是一盘一盘端出来的，谁也别想骗走","跟去看看，只看不动手"],r:["你把钱存进银行，看着数字一点点涨。","你忍住了没下手，但那一晚的心跳比干活还累。"]},
        w3e2:{t:"你打听到开大卡车一年能挣好几万，就是要先花錢考 CDL 驾照，还要脱产学几周。",c:["拼了！报名驾校，这是改变命运的机会","太贵了，再攒攒看"],r:["报名表签下去的那一刻，你的手有点抖——是兴奋的。","又攒了几个月，你终于也报了名。"]},
        w4e1:{t:"驾校里，教练指着那台庞然大物说：「这就是你以后的办公室，带轮子的。」",c:["认真练倒车入库，这是考试大项","先上路跑两圈找找感觉"],r:["倒车练到闭着眼都能进——教练点头了。","路感不错，教练说你有点天赋。"]},
        w4e2:{t:"笔试全是英文专业词，你把词典都翻烂了。考试前一晚，你紧张得睡不着。",c:["再刷一遍题库，拼了","早点睡，相信平时的积累"],r:["题库刷完，你心里有底了。","一觉醒来，状态不错。"]},
        w4e3:{t:"路考日！考官坐在副驾一言不发。你握紧方向盘——最后的实际上路测试，就是下面的小游戏。",c:["深呼吸，发动卡车","在心里给自己喊了声加油"],r:["上路！躲开障碍，稳稳开到终点！","你行的，上路！"]},
        w5e1:{t:"第一次跑长途：1200 英里，横穿三个州。凌晨的高速上只有你和星星。",c:["按计划跑，该休息就休息，安全第一","赶时间，一口气开到底"],r:["稳稳当当，准时交货。","你困得在服务区趴了二十分钟——以后再也不敢了。"]},
        w5e2:{t:"公司夸你出勤好，问你要不要考虑自己买车当车主司机（owner-operator），赚得更多，但风险也自担。",c:["算笔账再说：贷款、保险、油钱，一项项算清","先继续开公司的车，稳当"],r:["你把账算了三遍，决定先稳一稳。","打工皇帝也不错，收入稳定增长。"]},
        w6e1:{t:"你咨询了移民律师。律师说：你这种情况，可以走雇主担保，流程长，但路是正的。费用不低。",c:["办！身份是根，钱可以再挣","再攒一年钱，材料也准备得充分点"],r:["律师楼出来，你看着天上的云，觉得日子有了盼头。","准备期里你把每一份文件都整理得清清楚楚。"]},
        w6e2:{t:"等待身份的日子里，你收到老家消息：父亲生病住院。你握着电话，第一次觉得大洋好宽。",c:["寄钱回去，请最好的医生，电话天天打","请假回国陪护——但回去可能就回不来了"],r:["钱汇到的那天，父亲在电话里说：你在外头，好好干，别惦记。","你最终没有回去。有些遗憾，要用一辈子慢慢还。"]},
        w7e1:{t:"你看中了一栋小房子：两居室，带个小院子，离华人超市十分钟。首付还差一点。",c:["加跑两条长途线，把首付凑齐","降低预算，换个小一点的先上车"],r:["钥匙拿到手那天，你在空房子里坐了很久。","房子小了点，但房产证上有你的名字。"]},
        w7e2:{t:"搬家那天，餐馆的老工友们都来帮忙。老太太客人送来一盆绿植：「房子有了，日子会越过越旺。」",c:["请大家在院子里吃烧烤——美国的第一顿「乔迁宴」","先收拾，改天再聚"],r:["烧烤的烟飘过院子，你忽然觉得，这里就是家了。","绿植摆在窗台上，阳光正好。"]},
        w8e1:{t:"绿卡下来了。你符合入籍条件，考试内容是一百道美国历史地理题。",c:["每天背十道，稳扎稳打","年轻时记性好，突击一周搞定"],r:["考试那天你对答如流，考官笑着说：欢迎。","突击成功！你擦了擦汗：这辈子考试没输过。"]},
        w8e2:{t:"宣誓仪式礼堂里，你想起了地下室的那张床垫、餐馆的油烟、凌晨高速上的星星。",c:["红着眼眶念完誓词","给老家的父母打视频：爸，妈，我入籍了"],r:["从今天起，你是美国公民了。这一路的苦，都成了勋章。","电话那头，父亲沉默了很久，说：好，好，出息了。"]},
        i1e1:{t:"你带着积蓄落地，先考察市场。中介带你看了三个铺面：市中心的贵、华人区的人气旺、郊区的便宜但没人流。",c:["选华人区的人气铺：贵一点，但客流就是钱","选郊区便宜铺：省下的钱做装修和营销"],r:["签约那天，房东笑着说：这个位置，上一家也是做餐馆的——但愿你比他命好。","店面定下来了，接下来是装修马拉松。"]},
        i1e2:{t:"装修报价吓你一跳：厨房排烟、燃气管道、消防喷淋，样样都要合规，样样都烧钱。",c:["该花的花，合规是底线，一次到位","找华人装修队，便宜灵活，边干边改"],r:["预算超了三成，但你知道这些钱不能省。","装修队很给力，就是消防检查前你连夜补了两个喷淋头。"]},
        i2e1:{t:"开业第一天，鞭炮（在心里）齐鸣。午市高峰，后厨出菜慢，前厅乱成一团——你系上围裙亲自上！",c:["撸起袖子帮厨上菜——开始上菜挑战","站在收银台稳住阵脚，喊号调度"],r:["客人已经坐满了，快！","你调度得当，高峰总算扛过去了大半。"]},
        i2e2:{t:"开业一周，点评网站上出现了第一个差评：「等菜 40 分钟。」你盯着那行字，半天没说话。",c:["公开回复致歉 + 私信送优惠券，真诚补救","优化出餐流程，用实力回击"],r:["那位客人更新了评价：「老板态度很好，再给一次机会。」","一个月后，同类差评再没出现过。"]},
        i3e1:{t:"下午三点，卫生检查员毫无预兆地推门而入，拿着表格和手电筒。你的心跳漏了一拍。",c:["坦然迎上去：请随便看，我们天天按标准来","一边陪检一边使眼色让员工赶紧收拾后厨"],r:["冰箱温度、食材标签、员工健康证——逐项过关。","小问题当场整改，检查员点了点头：总体不错。"]},
        i3e2:{t:"检查员指着排水口说：油脂分离器要定期清理，不然下次就扣分了。",c:["当场约专业公司，每月定期维护，钱花在明处","让员工轮流清理，省下这笔钱"],r:["维护合同签好，你在合规清单上又打了一个勾。","员工清理得很认真，暂时没出问题。"]},
        i4e1:{t:"店里生意稳了，老客人开始问：什么时候开第二家？你看着排队的人龙，心里盘算。",c:["开！趁热打铁，品牌连锁走起","先把第一家做到极致，别贪多嚼不烂"],r:["第二家的选址你亲自跑了二十个地方。","你把第一家店的评分冲到了 4.8 星。"]},
        i4e2:{t:"本地报纸来采访你：「移民创业故事」专题。记者问你成功的秘诀。",c:["实话实说：没什么秘诀，就是把每一盘菜做好","谦虚笑笑：运气好，赶上好时候"],r:["报道登出来，周末的队伍排到了街口。","低调是你的保护色，生意照样红火。"]},
        i5e1:{t:"律师帮你梳理投资移民材料：资金来源证明、雇员名单、纳税记录，厚厚三大本。",c:["一项项核对，补齐所有缺口","交给律师团队，自己专心经营"],r:["材料递上去那天，你长出一口气。","律师说材料很完整——你的账目一直做得干净。"]},
        i5e2:{t:"等待审批的日子，你的店成了社区活动的小据点：华人春节聚餐、留学生包饺子之夜都在这里办。",c:["继续办！店是生意，也是乡愁的解药","专注经营，活动偶尔为之"],r:["你的店上了本地「最值得去的十家小店」名单。","口碑在社区里悄悄传开。"]},
        i6e1:{t:"绿卡批了。你做的第一件事，是去看房：学区好点的社区，推窗能看见山。",c:["买！事业和身份都稳了，是时候安家了","再观望观望房价"],r:["签约、过户、拿钥匙——你给爸妈打视频：过年，都来美国过。","又看了半年，你买到了更心仪的一栋。"]},
        i6e2:{t:"父母来美国小住。爸爸站在你的餐馆门口，看着招牌，伸手摸了摸，说：这字，是咱家的姓。",c:["你笑着说：爸，进去坐，我给你炒俩菜","一家人拍了张全家福，挂在店里墙上"],r:["那盘菜，爸爸吃得一干二净。","照片挂在收银台后面，每个客人都能看见。"]},
        i7e1:{t:"入籍考试通过，就等宣誓。你在美国的这些年：开店、纳税、雇了十几个员工、培养了两个徒弟开自己的店。",c:["感慨万千：我不只是来了美国，我成了社区的一部分","平常心：日子还长，一步一步来"],r:["宣誓前一晚，你失眠了——是高兴的那种。","你把第二天的西装熨得笔挺。"]},
        i7e2:{t:"宣誓仪式结束，你走出礼堂。一抬头，你的餐馆就在两个街区外，午市的队伍已经排起来了。",c:["回店里，系上围裙——今天我亲自掌勺","给自己放半天假，去看看这座城市"],r:["客人们不知道，今天掌勺的，是一位崭新的美国公民。","这座城市，你终于可以慢慢看了。大结局！"]}
      },

        work:"打工路走完了：床垫、油烟、方向盘、房产证——你挣回来的每一分钱，都写着你的名字。",

      ev:{
        s1e1:{t:"First day of language school. The teacher talks as fast as a rap song. You sit in the back row and don't understand a single word.",c:["Chase the teacher after class, ask her to slow down, and start a study group with classmates","Just grind practice tests alone and save the social energy"],r:["The teacher is impressed and gives you a pile of extra prep materials.","You grind hard, but your speaking never gets practiced. It nags at you."]},
        s1e2:{t:"Your roommates party every night and the kitchen always smells like pizza. Your mock exam is still 5 points short.",c:["Join the party and catch up on weekends — happiness is fuel too","Skip the party and finish tonight's listening practice"],r:["At the party you make foreign friends, and your speaking takes off.","Listening done, score steady — but you're a little homesick."]},
        s1e3:{t:"A week before the exam, Mom video-calls: everything's fine at home, don't skimp on yourself. You hang up and sigh at your bank balance.",c:["Book a cram course — pricey, but passing the first time matters most","Study on your own and save the money for tuition"],r:["The cram course predicts the question types. You walk in steady.","Money saved — but your palms are sweating in the exam hall."]},
        s2e1:{t:"Time to pick schools. The famous ones cost a fortune; the ordinary ones feel like settling. The agent says: applying smart beats applying big.",c:["Aim high! You only live once","Balance it: two dream schools, two safe schools"],r:["Application fees sting, but the dream school's poster goes up on your wall.","A sensible mix — even the agent calls you clear-headed."]},
        s2e2:{t:"Your essay prompt: \"Why do you want to come to America?\" You stare at the blank page all afternoon.",c:["Write about Grandma: she always said studying takes you further","Grab a template and stitch together a \"standard answer\""],r:["You cry a little writing it, then smile through the edits. It rings true.","It's finished — but it could be anyone's story."]},
        s2e3:{t:"Acceptance letters arrive! One top-ranked school, no scholarship. One mid-ranked school, half scholarship.",c:["Take the top-ranked one — bite the bullet, earn it back later","Take the half scholarship — half the financial pressure"],r:["You screenshot the letter to the family chat. It explodes with joy.","The half scholarship lifts a real weight off your parents."]},
        s3e1:{t:"Interview day. A long line outside the consulate. The guy ahead of you walks out with his head down.",c:["Deep breath, rehearse your answers, step up calmly when it's your turn","The nerves build and your palms sweat"],r:["Every question is one you prepared for. You answer steadily.","Your legs shake a little — but your documents are complete."]},
        s3e2:{t:"The officer suddenly asks: \"Do you plan to stay in America after graduation?\" — a trap question.",c:["Tell the truth: work a few years for experience, you miss home too, and you'll follow every rule step by step","A hard no: Absolutely not! Going straight home after graduation!"],r:["The officer looks up, nods, and types something. Honesty scores points.","You say it so hard the officer frowns — but your file is strong, and you pass."]},
        s4e1:{t:"You land with two big suitcases. A senior student picks you up: \"Welcome to America. First, a burger.\"",c:["Relief — sleep well tonight, start the new life tomorrow","Too excited to sleep; explore the neighborhood all night"],r:["You wake up clear-headed. The new life begins.","Out until midnight — paperwork day with dark circles under your eyes."]},
        s4e2:{t:"The lease is all in English; the deposit is two months' rent. Your roommate warns the bathroom is always taken.",c:["Sign it — close to campus is worth it","Keep looking: farther away but half the price"],r:["Close to campus: an extra hour of sleep every day. Worth it.","The commute is longer, but the savings cover a month of food."]},
        s4e3:{t:"You get a part-time job at the campus café. The manager says: rush hour is a war zone. Can you handle it?",c:["Yes! I'm quick — start the serving challenge","Let me try one day first"],r:["Then show us what you've got!","A trial day is still work. Sleeves up!"]},
        s5e1:{t:"Midterms. The library is open all night; your roommate is asleep on the desk. The professor warns: 30% fail this class.",c:["Form a study group and survive together","Coffee and willpower — solo grind"],r:["The group's top student shares the key points. Everyone benefits.","You survive — at the cost of a few more hairs."]},
        s5e2:{t:"In your programming class, the big project is a working website. You've been stuck on one bug for two days.",c:["Go to office hours and ask the professor (and get on her radar)","Grind it out alone, reading docs until dawn"],r:["Three sentences from the professor unlock everything. She compliments your question.","The bug falls at 4 a.m. You grin at the screen like a maniac."]},
        s5e3:{t:"Thanksgiving. A local classmate invites you to her family's dinner. There's an enormous turkey.",c:["Go — and bring a plate of homemade dumplings","Decline politely; instant noodles and homework in the dorm"],r:["The dumplings vanish in minutes. You're invited back for Christmas. America can have a place for you.","Noodles done, homework done — just a little lonely."]},
        s6e1:{t:"Graduation season. The career fair is packed. You've sent 80 résumés and heard almost nothing back.",c:["Polish the résumé, drill interviews, ask alumni for referrals — everything at once","Lower the bar for now; any job is a start"],r:["A referral works. Three interviews land.","Stay calm. Good news is on its way."]},
        s6e2:{t:"After the final interview, the engineering manager says, \"Your skills are solid.\" A week later the offer email sits in your inbox — the salary makes you rub your eyes.",c:["Sign it! First job — get on board","Wait for the other company's result"],r:["You forward the offer to your parents: \"I did it.\"","The wait is agony, but you want a better start."]},
        s6e3:{t:"Your last free weekend before the job starts, friends drag you out for pickup soccer and basketball.",c:["Go! On the field, one kick decides it","Sleep in and recharge at home"],r:["Game time — stretch those legs!","You sleep like the dead and wake up fully recharged."]},
        s7e1:{t:"Your company files your H-1B lottery entry. Hundreds of thousands of people chase tens of thousands of slots. Everyone in the office is sharing lucky charms.",c:["Share the lucky charm, take a breath, press the draw button","Stay zen and wait for the result"],r:["The button of fate has been pressed…","Eat well, sleep well, leave it to fate."]},
        s8e1:{t:"After the lottery comes the long green card line. The lawyer says: paperwork, patience, no shortcuts.",c:["Prepare documents step by step; pick up a certificate course on weekends","Refresh the backlog bulletin daily and spiral"],r:["A full life makes the waiting pass faster.","Anxiety doesn't shorten the line — it just shortens your sleep."]},
        s8e2:{t:"Two years of waiting: a promotion, a better apartment. Looking at the city lights, you remember your first night off the plane.",c:["Call home for a long chat — good news only","Take friends out for a proper dinner to mark the moment"],r:["Mom laughs through tears on the phone: \"My kid made it.\"","This dinner tastes like every hard year behind you."]},
        s8e3:{t:"The approval notice arrives! That little green card — you've waited years for it.",c:["Slide it carefully into the deepest slot of your wallet","Treat everyone who ever helped you to dinner"],r:["From today, you are a permanent resident.","The people at this table are your American family."]},
        s9e1:{t:"The citizenship test covers U.S. history: first president? First Amendment? You've memorized all 100 questions cold.",c:["Walk in confident","So nervous you say \"Lincoln\" for Washington (and catch yourself)"],r:["The officer closes the folder, smiling: \"Congratulations.\"","A false alarm — you still get them all right."]},
        s9e2:{t:"At the oath ceremony you raise your right hand. Around you: new citizens from dozens of countries — some crying, some laughing, some holding babies.",c:["Your own eyes go red — the road was worth it","Wave and grin: from today, this is my country too"],r:["You walk out into the sunshine. Your American story is just beginning.","The finale! And you know the next chapter is even better."]},
        w1e1:{t:"You land with two suitcases and a pocket of cash. Your English is \"Hello\" and \"Thank you.\" First night: a basement room-share, $300 a month for a mattress.",c:["Take it — surviving comes first","Spend a bit more for a decent room; rest is work fuel"],r:["The basement is damp, but cheap is cheap.","A bright room. Your first good sleep since landing."]},
        w1e2:{t:"A fellow immigrant points you to a Chinese restaurant paying cash under the table: 11-hour days, meals and a bunk included.",c:["Take it! Income first","Keep looking for something on the books"],r:["Day one ends with a sore back — and your first American earnings in your pocket.","Two days of searching nearly empties your pockets. You take the restaurant job anyway — get on board first."]},
        w1e3:{t:"Payday: the boss shorted you $100 — \"training fee.\" Your coworkers tell you to swallow it.",c:["Do the math face to face: hours worked are hours owed","Swallow it and see what next month brings"],r:["The boss grumbles, pays up, and treats you with a bit more respect.","The money never comes back. You file the lesson away."]},
        w2e1:{t:"You're officially a waiter now. The shift lead says: tips are your life, a smile is your weapon.",c:["Memorize the menu, drill English ordering — start the serving challenge","Learn on the job, starting now"],r:["Customers are coming in — get ready!","A chaotic first day begins."]},
        w2e2:{t:"An elderly lady comes every week, orders the same dish, and always over-tips. She says you remind her of her grandson.",c:["Memorize her usual; have her tea ready when she walks in","Warm service for everyone, no favorites"],r:["She introduces you to half the street. Your tips jump.","Your smile becomes one of the restaurant's signatures."]},
        w3e1:{t:"Months in, your savings pass $5,000 for the first time. A coworker wants to hit the casino to \"double it\"; another pushes a \"can't-lose\" coin.",c:["No way! This money was earned plate by plate — nobody's taking it","Go watch, but don't touch"],r:["You bank the money and watch the number climb.","You keep your hands off — though your heart pounds harder than at work."]},
        w3e2:{t:"You hear truck drivers make serious money — but the CDL license costs money, plus weeks of school with no income.",c:["Go for it! Enroll — this is the chance to change your life","Too expensive; save a while longer"],r:["Your hand shakes signing the form — from excitement.","A few more months of saving, then you enroll too."]},
        w4e1:{t:"At truck school, the instructor pats the huge rig: \"This is your new office. It has wheels.\"",c:["Drill backing-up parking — the big test item","Get on the road and find the feel first"],r:["You can back it in with your eyes closed. The instructor nods.","Good road feel — the instructor says you have a knack."]},
        w4e2:{t:"The written test is all technical English. You've worn the dictionary out. The night before, you can't sleep.",c:["One more pass through the question bank — all in","Sleep early and trust the preparation"],r:["Question bank done. You feel ready.","You wake up in decent shape."]},
        w4e3:{t:"Road test day! The examiner sits silently beside you. You grip the wheel — the final driving test is the mini-game below.",c:["Deep breath. Start the truck","Give yourself a silent pep talk"],r:["Hit the road! Dodge everything and drive steady to the finish!","You've got this. Roll!"]},
        w5e1:{t:"Your first long haul: 1,200 miles across three states. At 3 a.m., the highway is just you and the stars.",c:["Stick to the plan — rest when it's time. Safety first","Push through in one go to save time"],r:["Steady driving, on-time delivery.","You nap face-down at a rest stop for twenty minutes — never again."]},
        w5e2:{t:"Dispatch loves your record and asks about becoming an owner-operator: more money, but the risk is yours.",c:["Run the numbers first: loan, insurance, fuel — line by line","Keep driving the company truck — steady is good"],r:["You do the math three times and decide to wait.","A company driver earns steadily too. No shame in that."]},
        w6e1:{t:"You consult an immigration lawyer. She says employer sponsorship is a real path for you — long, proper, and not cheap.",c:["Do it! Status is the root; money can be earned again","Save one more year and prepare everything fully first"],r:["You walk out of the law office and the clouds suddenly look hopeful.","During the prep year, you organize every document perfectly."]},
        w6e2:{t:"While you wait, news comes: your father is in the hospital back home. You hold the phone and the ocean feels very wide.",c:["Wire money home, hire the best care, call every day","Fly home to care for him — knowing you may not be able to return"],r:["When the money lands, your father says: \"You do good work out there. Don't worry about us.\"","In the end, you don't go. Some regrets are repaid over a lifetime."]},
        w7e1:{t:"You fall for a small house: two bedrooms, a little yard, ten minutes from the Asian supermarket. The down payment is almost there.",c:["Pick up two extra long-haul routes and close the gap","Lower the budget — a smaller place to get on the ladder"],r:["The day the keys are in your hand, you sit in the empty house for a long time.","Smaller than you dreamed — but the deed has your name on it."]},
        w7e2:{t:"Moving day: your old restaurant coworkers all show up to help. The elderly regular brings a plant: \"A house means your days will only grow better.\"",c:["Fire up the grill in the yard — your first American housewarming","Unpack first, celebrate another day"],r:["Grill smoke drifts over the yard, and suddenly — this is home.","The plant sits on the windowsill, right in the sun."]},
        w8e1:{t:"The green card arrived. You're eligible for citizenship: 100 civics questions stand between you and the oath.",c:["Ten questions a day, slow and steady","Cram for a week — your memory is still sharp"],r:["On test day you answer fluently. The officer smiles: \"Welcome.\"","The cram works! You wipe your brow: you've never lost an exam in your life."]},
        w8e2:{t:"In the ceremony hall, you remember the basement mattress, the restaurant grease, the stars over the 3 a.m. highway.",c:["Take the oath with red eyes","Video-call your parents: \"Mom, Dad — I'm a citizen now\""],r:["From today, you are a U.S. citizen. Every hardship became a medal.","A long silence on the phone. Then your father says: \"Good. Good. You did us proud.\""]},
        i1e1:{t:"You land with your savings and scout the market. The agent shows three spaces: pricey downtown, busy in the immigrant district, cheap in the suburbs with no foot traffic.",c:["The busy district space: pricier, but foot traffic is money","The cheap suburb space: savings go to renovation and marketing"],r:["Signing day, the landlord grins: \"The last tenant here was a restaurant too — may your luck be better.\"","Space secured. Now the renovation marathon begins."]},
        i1e2:{t:"The renovation quote makes you gasp: kitchen exhaust, gas lines, fire sprinklers — every item must be up to code, and every item burns cash.",c:["Pay what's needed — code compliance is the floor, done once, done right","Hire a cheaper crew and adjust as you go"],r:["Thirty percent over budget — but you know this money can't be saved.","The crew is great, though you add two sprinkler heads the night before the fire inspection."]},
        i2e1:{t:"Opening day! The lunch rush hits: the kitchen is slow, the floor is chaos — you tie on an apron and jump in yourself.",c:["Sleeves up, help serve — start the serving challenge","Hold the register and direct traffic like a general"],r:["The dining room is full — move!","Your directing gets the rush mostly under control."]},
        i2e2:{t:"A week in, the first one-star review lands: \" Waited 40 minutes for food.\" You stare at it for a long moment.",c:["Reply publicly with an apology, send a coupon privately — make it right","Fix the kitchen flow and let the food answer"],r:["The reviewer updates: \"Owner is sincere. Giving them another chance.\"","A month later, that kind of review never appears again."]},
        i3e1:{t:"3 p.m. The health inspector walks in unannounced, clipboard and flashlight in hand. Your heart skips a beat.",c:["Welcome her openly: inspect anything — we run to standard every day","Escort her while signaling the crew to tidy the kitchen, fast"],r:["Fridge temps, food labels, health permits — item by item, all pass.","Small issues fixed on the spot. The inspector nods: \"Overall, solid.\""]},
        i3e2:{t:"The inspector points at the drain: the grease trap needs regular cleaning, or it's points off next time.",c:["Book a professional service on the spot — monthly, money well spent","Have staff rotate the cleaning and save the fee"],r:["Service contract signed. Another check on the compliance list.","The crew cleans it carefully. No problems — for now."]},
        i4e1:{t:"Business is steady and regulars ask: when's the second location? You watch the line out the door and do the math.",c:["Go! Strike while it's hot — build the brand","Perfect the first store first; don't bite off too much"],r:["You personally scout twenty locations for store number two.","You push the first store to a 4.8-star rating."]},
        i4e2:{t:"The local paper interviews you for an \"immigrant business stories\" feature. The reporter asks your secret.",c:["The truth: no secret — just make every single plate right","Smile modestly: good luck, good timing"],r:["After the story runs, the weekend line reaches the corner.","Low profile is your armor. Business booms anyway."]},
        i5e1:{t:"Your lawyer assembles the investor immigration file: source-of-funds proof, employee roster, tax records — three thick binders.",c:["Review every item yourself and fill every gap","Trust the legal team and focus on the business"],r:["The day it's filed, you exhale for the first time in weeks.","The lawyer says the file is complete — your books were always clean."]},
        i5e2:{t:"While you wait, your restaurant becomes the neighborhood's living room: Lunar New Year dinners, dumpling nights for students far from home.",c:["Keep hosting! A restaurant is business — and a cure for homesickness","Focus on operations; host only now and then"],r:["Your place lands on the local \"ten small restaurants worth the trip\" list.","Word of mouth spreads quietly through the community."]},
        i6e1:{t:"The green card is approved. First thing you do: house hunting in a good school district, windows facing the hills.",c:["Buy! Business and status are both steady — time to settle","Watch prices a while longer"],r:["Signing, closing, keys — you video-call your parents: \"New Year, everyone comes to America.\"","Six more months of looking land you an even better house."]},
        i6e2:{t:"Your parents visit. Your father stands at the restaurant door, touches the sign with your family name, and says: \"These characters — that's our name.\"",c:["Laugh: \"Dad, come in. I'll cook you two dishes myself\"","Take a family photo and hang it in the restaurant"],r:["Your father cleans his plate to the last grain.","The photo hangs behind the register, where every guest can see it."]},
        i7e1:{t:"Civics test passed, oath scheduled. Your years here: a business, taxes paid, a dozen employees, two apprentices who now run their own places.",c:["Emotional: \"I didn't just come to America — I became part of this community\"","Calm: life is long; one step at a time"],r:["The night before the oath, you can't sleep — the happy kind of insomnia.","You iron tomorrow's suit to a perfect crease."]},
        i7e2:{t:"The ceremony ends. You step outside — your restaurant is two blocks away, and the lunch line is already forming.",c:["Back to the restaurant, apron on — today, the boss cooks","Take the afternoon off and go see this city"],r:["The guests don't know it, but today's chef is a brand-new American citizen.","Now you can take your time with this city. The finale!"]}

        b1e2:{t:"放学后，校队在招人：足球队和篮球队都在选拔。教练说：能不能进队，就看临场这一脚 / 这一投。",c:["去试试！站上球场，一脚定乾坤","还是专心读书，运动以后再说"],r:["深呼吸，看准了再出手——球场见真章！","你回了教室，但心里想着：下次选拔，我一定去。"]},
        b2e1:{t:"你想买双新球鞋，也想攒钱以后买车。家附近的快餐店在招兼职，时薪不错，就是要穿制服、闻一下午油烟味。",c:["去打工！自己的钱自己挣——开始上菜挑战","再想想，学习要紧"],r:["制服一穿，你就是快餐店的一员了。客人马上进来，准备好！","想是想明白了，但钱包还是瘪的——最后你还是投了简历。"]},
        b3e1:{t:"毕业季，你收到两个 offer：一家大公司，稳定但涨薪慢；一家创业公司，工资高一点，但谁也不知道它能活几年。",c:["去大公司：先站稳，攒经验攒履历","去创业公司：年轻，赌一把成长速度"],r:["工牌挂上脖子的那天，你在办公楼下站了很久：我也是社会人了。","创业公司的节奏快得飞起，你一个月学到的东西顶过去一学期。"]},
        b3e2:{t:"第一份工资到账。你看着数字，第一次真切地感觉到：以后的路，要自己花钱走了。",c:["先存下一笔应急钱，再犒劳自己一点","报名考个职业证书，投资自己"],r:["应急账户开起来，你也是有「六个月底气」的人了。","证书到手，简历上多了一行金闪闪的字。"]},
        f1e1:{t:"一家人拖着行李落地美国。爸妈看中一套出租屋，可房东开价偏高，爸妈的英文又不太利索。房东看着你们一家，报了个价就不说话了。",c:["站出来当翻译，帮爸妈跟房东砍价：长租、按时付租，诚意满满","躲在爸妈身后玩手机，让他们自己谈"],r:["你一句一句翻译、还价，房东最后降了价，还夸你这孩子懂事。新家的钥匙，拿到手了。","爸妈连说带比划，勉强签了下来，就是价格没谈下来。你有点内疚。"]},
        f1e2:{t:"安顿下来的第一晚，一家人挤在出租屋里吃泡面。妈妈说：「地方小，心齐就行。」窗外是陌生的城市灯火。",c:["你暗暗发誓：好好读书，以后让爸妈住大房子","先睡一觉，明天的事明天再说"],r:["这一夜你睡得不沉，但心里有团小火苗。","一觉醒来，美国的第一个清晨开始了。"]},
        f2e1:{t:"转学第一天，你站在教室门口，老师让你自我介绍。你张了张嘴，英文卡在喉咙里，全班都看着你。",c:["深呼吸，慢慢说——说错了也没关系","低着头小声说完名字就坐下"],r:["你说完，几个同学笑着鼓掌。下课还有人主动来跟你打招呼。","虽然声音小，但你完成了第一步。慢慢来。"]},
        f2e2:{t:"同桌是个本地孩子，午餐时总把妈妈做的三明治分你一半，还邀请你周末去他家玩游戏机。",c:["去！还带上妈妈做的饺子当回礼","婉拒，周末要在家帮爸妈干活"],r:["饺子大受欢迎，你交到了来美国后的第一个朋友。","你帮家里干了活，但看着同学群里的照片，心里有点痒。"]},
        f3e1:{t:"爸妈白天打工很辛苦。你在学校旁边的餐馆找到一份课后兼职：洗碗、上菜，时薪不多，但能贴补家用。",c:["干！撸起袖子——开始上菜挑战","先专心读书，成绩好才是帮家里"],r:["后厨的师傅说你手脚麻利。客人进门了，上菜！","你回了家摊开课本，但总惦记那家餐馆的招聘纸。"]},
        f4e1:{t:"你满 16 岁了，可以考驾照了！笔试的题库厚厚一本，全是英文交通规则。教练说：路考那天，考官就坐在你旁边。",c:["题库刷三遍，稳稳地考","先上路练手感——路考就是下面的小游戏"],r:["准备充分，心里有底。发动车子，上路！","手心有点汗，但你平时练得不少。上路！"]},
        f5e1:{t:"高中毕业，全家人围坐在餐桌旁商量你的前途：社区大学便宜、离家近；州立大学名气大，但学费要贷款。",c:["去州立大学：贷点款也要读个好学校","先读社区大学，再转学——省一大半学费"],r:["录取信到的那天，妈妈把信裱了起来。贷款的事，一家人一起扛。","社区大学的老师夸你聪明。转学的路，你一步一步走得很稳。"]},
        f5e2:{t:"你拿到了第一份全职工作的 offer。发工资那天，你做的第一件事，是给爸妈包了个红包——不多，是个心意。",c:["从此每月给家里交一份生活费","先攒钱，准备搬出去独立生活"],r:["妈妈推让了半天，最后红着眼收下：我娃挣钱了。","爸妈嘴上说不用，脸上的笑藏都藏不住。"]},
        f6e1:{t:"在美国这么多年，一家人终于都符合入籍条件了。考试那一百道题，爸妈背得比你还认真，餐桌上天天互相抽问。",c:["每晚陪爸妈复习，当他们的陪考教练","各自复习，考试那天一起去"],r:["考试那天，爸妈对答如流。走出考场，老爸说：今晚加菜。","一家三口，全部一次通过——整整齐齐。"]},
        f6e2:{t:"宣誓仪式上，你们一家人坐在一起。妈妈握着你的手，有点抖。想想刚来那年那间小出租屋，再看看今天——像做梦一样。",c:["你握紧妈妈的手：妈，咱们扎根了","笑着挥手：这一家人，就是美国的新公民啦"],r:["走出礼堂，你请爸妈去吃了一顿好的。这一次，换你请。","大结局——但你知道，这个家的故事，才刚刚开始。"]}
      },

      }
    },

      routes:{
        born:{ name:"Born in the USA", icon:"👶", desc:"Born and raised in America: no plane ticket, no visa line — but life's levels are all still there: school, first job, first apartment, first car, a home and a family.",
          tags:["Start with $5,000","Start at 18","Citizen from birth"] },
        family:{ name:"Immigrated with Parents", icon:"👨‍👩‍👧", desc:"You came to America as a kid with your parents: one rented room for the whole family at first — settling in, a new school, after-school jobs, a driver's license, building a life together.",

      levels:{
        b1:{name:"High School Level", sub:"Classes, friends, first big choices", goal:"Settle into school life and take your shot on the field (shooting mini-game)."},
        b2:{name:"First Job Level", sub:"After-school shifts at the burger joint", goal:"Work the fast-food counter (serving mini-game) and earn your first real money."},
        b3:{name:"Career Start Level", sub:"Your first real full-time job", goal:"Land your first full-time job and become a working adult."},
        f1:{name:"First Home Level", sub:"One family, one rented apartment", goal:"Help your parents bargain with the landlord and sign the lease — your family's first foothold in America."},
        f2:{name:"New School Level", sub:"New school, new language, new friends", goal:"Find your footing at the new school and make your first friend."},
        f3:{name:"After-School Job Level", sub:"A restaurant job after class", goal:"Work part-time at a restaurant (serving mini-game) and help the family out."},
        f4:{name:"Driver's License Level", sub:"Your first license at sixteen", goal:"Pass the driving test and get out on the road (driving mini-game)."},
        f5:{name:"Graduation Level", sub:"College, or work first?", goal:"Make your first big post-graduation choice and take your first independent step."},
        f6:{name:"Roots Level", sub:"The whole family takes the oath", goal:"Walk the citizenship path with your parents — this family officially puts down roots."},
        car:{name:"First Car Level", sub:"Cash, a loan, or a lease?", goal:"Pick your first car, then decide how to pay: all cash, a loan in installments, or a lease."},
        rent:{name:"First Apartment Level", sub:"Bargain with the landlord, then sign", goal:"Negotiate the rent down, then read the lease line by line before you sign."},
        home:{name:"Home Buying Level", sub:"House hunting, a mortgage, the keys", goal:"Choose the house, get the mortgage approved, and hold the keys in your hand."},
        love:{name:"Family Level", sub:"Marriage and a baby", goal:"Marry the right person and welcome your baby — life enters a new chapter."}

      ev:{
        rent1:{t:"You find a rental you love: great light, great location — but the landlord is asking $150 a month above the neighborhood rate. The old landlord sizes you up at the door.",c:["Bargain: \"I'll sign a two-year lease if you drop $100 a month — no vacancy headaches for you\"","Don't haggle — the location is worth it, sign now"],r:["The landlord thinks it over and shakes your hand: \"Two years. Deal.\" You just saved real money every month.","He smiles and produces the lease. You quietly do the two-year math and wince a little."]},
        rent2:{t:"Signing day. Buried in the lease is a new clause: \"$500 cleaning fee on move-out; nail holes in walls charged extra.\" The pen is already in your hand.",c:["Read every line and negotiate the unfair clause away before signing","Just sign — moving in is what matters"],r:["You point at the clause; he shrugs and crosses it out. This is why you read contracts.","Signed — but on move-out day, that clause is going to cost you."]},
        car1:{t:"A job means you need a car. At the dealership: shiny new cars on the left, half-price used cars on the right, and a smiling salesperson walking your way.",c:["Buy new: worry-free, under warranty — but pricey","Buy used: half the price, and a car-savvy friend can check it"],r:["Driving the new car off the lot, even the sunlight feels special.","The used car is in great shape. You keep the savings as a repair fund — smart."]},
        car2:{t:"Time to pay. The salesperson offers three options: pay in full, cash; a loan — down payment now, monthly payments after; or a lease — the lowest monthly cost, return the car in three years and drive a new one.",c:["Pay in full: one payment, no monthly bill, the car is mine","Take a loan: down payment now, the rest in monthly installments","Lease it: lowest monthly payment, a new car every three years"],r:["One big payment stings — but from today, this car is entirely, completely yours.","Down payment plus monthly bills: manageable. This is how car life in America begins.","The lease payment is genuinely low — the car just won't be yours in three years. Driving it, you decide that's fine."]},
        love1:{t:"You've been together for years and it's solid. One ordinary evening, your hand finds the little ring box in your pocket — it's time. How to do the wedding is a decision for two.",c:["A big, joyful wedding: invite everyone who matters","A simple courthouse ceremony + small dinner: save the money for a home"],r:["The room is full of everyone you love, laughing. You'll remember this day forever.","A license, a good meal, one photo — simple, and not one bit less happy."]},
        love2:{t:"Big news: the baby is coming! The list — crib, formula, diapers — runs three pages. Leave, help, who's on night duty: two brand-new parents, busy and beaming.",c:["Bring in family help / hire a postpartum helper: buy some peace of mind","Take shifts, just the two of you, and save the money for the baby"],r:["With an extra pair of hands, you finally sleep through a night. The baby's first cry makes the whole family laugh.","It's exhausting — but the moment the baby falls asleep in your arms, it's all worth it."]},
        home1:{t:"After all that saving, it's house-hunting time. Two finalists: a pricier home in a top school district, or a bigger suburban house with a yard — and a longer commute.",c:["The school-district home: pricey, but great for the kids and resale","The big suburban house: comfort comes first"],r:["The day you sign, you're already picturing a kid with a backpack heading out the door.","Big house, big yard, weekend barbecues — this is what life is for."]},
        home2:{t:"The last big hurdle: the mortgage. The bank wants income proof, tax returns, credit history — nothing missing. Lock the rate today, or float it?",c:["Paperwork perfectly in order; lock the rate while it's good","Shop two more banks for a better rate first"],r:["The loan sails through. At closing, the keys land in your hand — heavier than you expected.","Two more quotes actually shave the rate a little. The wait pays off."]},
        b1e1:{t:"First week of high school: course selection. Hard honors classes help college applications but risk your GPA; regular classes are safe but plain.",c:["Take the honors classes — lay the road to college now","Play it steady and protect the GPA first"],r:["The classes are tough, but you keep up. Application season will thank you.","Steady grades, and time for clubs too — not a bad trade."]},
        b1e2:{t:"After school, the soccer and basketball teams hold tryouts. The coach says making the team comes down to one moment: one kick, one shot.",c:["Try out! On the field, one shot decides it","Focus on studying; sports can wait"],r:["Deep breath, pick your moment — game time!","You head back to class, thinking: next tryout, I'm going."]},
        b2e1:{t:"You want new sneakers — and you're saving for a car someday. The burger joint nearby is hiring: decent hourly pay, a uniform, and the smell of fryer oil all afternoon.",c:["Take the job! Earn your own money — start the serving challenge","Hold off — school comes first"],r:["Uniform on, you're part of the crew. Customers are coming — get ready!","You think it through… and send in the application anyway. The wallet wins."]},
        b3e1:{t:"Graduation season. Two offers: a big company — stable, slow raises; or a startup — a bit more pay, and nobody knows if it'll exist in two years.",c:["The big company: plant your feet, build experience and a résumé","The startup: you're young — bet on the learning curve"],r:["Badge around your neck, you stand outside the office tower: I'm a working adult now.","The startup moves at warp speed. You learn more in a month than in a semester."]},
        b3e2:{t:"Your first paycheck lands. Staring at the number, it hits you: from here on, the road is yours to pay for.",c:["Build an emergency fund first, then treat yourself a little","Sign up for a professional certificate — invest in yourself"],r:["Emergency fund started. You are now a person with a six-month cushion.","Certificate earned. Your résumé gains a line that shines."]},
        f1e1:{t:"Your family lands in America with suitcases in hand. Your parents like a rental, but the landlord's price is high — and their English isn't strong yet. He names his price and waits.",c:["Step up as translator and help your parents bargain: long lease, always on time — a solid offer","Hide behind your phone and let them handle it"],r:["You translate and bargain line by line. The landlord lowers the price and calls you a good kid. The keys to your new home are in your hand.","Your parents manage with gestures and get it signed — at the full price. You feel a little guilty."]},
        f1e2:{t:"Your first night, the whole family eats instant noodles squeezed into the little rental. Mom says: \"Small place is fine, as long as our hearts are together.\" Outside: a strange city's lights.",c:["Promise yourself: study hard, and one day buy your parents a big house","Sleep first — tomorrow can take care of itself"],r:["You sleep lightly that night, a small flame lit in your chest.","You wake up to your first American morning."]},
        f2e1:{t:"First day at the new school. The teacher asks you to introduce yourself. You open your mouth — the English sticks in your throat, and the whole class is watching.",c:["Deep breath, speak slowly — mistakes are okay","Whisper your name, head down, and sit"],r:["You finish, and a few classmates applaud. At break, someone comes over to say hi.","Quiet, but step one is done. One day at a time."]},
        f2e2:{t:"Your deskmate, a local kid, always shares half his mom's sandwich with you at lunch — and invites you over this weekend to play video games.",c:["Go! And bring Mom's homemade dumplings as a thank-you","Decline politely — weekends are for helping at home"],r:["The dumplings are a hit. You've made your first friend in America.","You help the family — but the photos in the group chat make you a little wistful."]},
        f3e1:{t:"Your parents work hard all day. You find an after-school job at the restaurant near school: dishes and serving. The pay isn't much, but it helps at home.",c:["Do it! Sleeves up — start the serving challenge","Focus on grades — good grades are the real help"],r:["The head cook says you're quick. Doors open — serve!","You open your textbooks at home… but keep thinking about that hiring sign."]},
        f4e1:{t:"You're sixteen — driver's license time! The written-test book is thick with English traffic rules. The coach warns: on test day, the examiner sits right beside you.",c:["Grind the question bank three times — walk in steady","Get a feel for the road first — the driving test is the mini-game below"],r:["Fully prepared, calm inside. Start the car — hit the road!","Palms a little sweaty, but you've practiced plenty. Roll!"]},
        f5e1:{t:"Graduation. The whole family sits around the table to plan your future: community college is cheap and close; the state university has the name — and tuition on loans.",c:["The state university: loans are worth it for a good school","Community college first, then transfer — half the tuition saved"],r:["When the acceptance letter comes, Mom frames it. The loans, the family carries together.","Your community-college teachers call you sharp. The transfer path, you walk it steady."]},
        f5e2:{t:"Your first full-time job offer arrives. On payday, the first thing you do is hand your parents a red envelope — not much, but it means everything.",c:["From now on, contribute to the household every month","Save up — get ready to move out and live independently"],r:["Mom refuses three times before accepting, eyes red: \"My kid earns money now.\"","Your parents say it's unnecessary — and can't stop smiling."]},
        f6e1:{t:"After all these years, the whole family is finally eligible for citizenship. Your parents memorize the 100 civics questions harder than you do — quizzing each other at the dinner table.",c:["Study with them every night — be their coach","Everyone studies solo; go together on test day"],r:["On test day your parents answer fluently. Walking out, Dad says: \"Tonight, we feast.\"","All three of you pass on the first try — the whole family, together."]},
        f6e2:{t:"At the oath ceremony, your family sits together. Mom's hand, holding yours, trembles a little. From that tiny rented room to this hall — it feels like a dream.",c:["Squeeze Mom's hand: \"Mom, we made it. We've put down roots\"","Wave and grin: this family is America's newest citizens"],r:["Outside the hall, you take your parents out for a proper dinner. This time, it's on you.","The finale — and you know this family's story is just beginning."]}
      },

    const AVATARS = [

      const av = avatarDef();
      if (!emoji) return av.person;

    const WKEY = "usa-life-wallet-v1";
    const TEST_USER = "disabled-758f5a21a656cd39", TEST_PASS = "4f0344d03d2931f5ea82d20e95ecf09dfa5c7bc5bbfc6ad4", TEST_COINS = 100000;
    const ACCKEY = "usa-life-account";
    let ACC = "main";   /* "main" 普通存档 | "tester" 测试账号存档 */
    function blankW(){ return { name:"", coins:0, steps:0, bonusGiven:false, ledger:[], avatar:"", culture:"", test:false }; }
    let W = blankW();
    function wkey(){ return ACC === "tester" ? WKEY + ":tester" : WKEY; }
    function loadAcc(){ try { ACC = localStorage.getItem(ACCKEY) === "tester" ? "tester" : "main"; } catch(e){ ACC = "main"; } }
    function saveAcc(){ try { localStorage.setItem(ACCKEY, ACC); } catch(e){} }
    function loadW(){
      W = blankW();
      try {
        const raw = localStorage.getItem(wkey());
        if (raw){ const p = JSON.parse(raw); if (p && typeof p === "object") W = Object.assign(W, p); }
      } catch(e){}
      W.test = (ACC === "tester");
      /* 旧存档没有头像：默认给第一个头像（之后可在首页更换） */
      if (W.name && !AVATARS.some(a => a.id === W.avatar)){ W.avatar = AVATARS[0].id; saveW(); }
      /* 文化装扮选择：校验后同步到 CULT（outfitOf 读取） */
      CULT = CULTURES.some(c => c.id === W.culture) ? W.culture : "";
      W.culture = CULT;
    }
    function saveW(){ try { localStorage.setItem(wkey(), JSON.stringify(W)); } catch(e){} }
    function addLedger(label, delta){
      W.ledger.unshift({ label, d: delta, b: W.coins });
      if (W.ledger.length > 60) W.ledger.length = 60;
      saveW();
    }
    function refreshCoinUI(){
      document.querySelectorAll(".coinval").forEach(el=>{ el.textContent = W.coins.toLocaleString("en-US"); });
    }
    /* 消费：成功返回 true；未登录或余额不足返回 false（余额不足自动弹商店） */
    function charge(amount, label, countStep){
      if (amount <= 0) return true;
      if (!W.name){ toast(t("ui.needLogin")); return false; }
      if (W.test){ if (countStep){ W.steps++; saveW(); } sfxPay(); return true; }  /* 测试账号：不扣币，余额恒定；花钱下行音照常响 */
      if (W.coins < amount){ showShop(amount); return false; }
      W.coins -= amount;
      if (countStep) W.steps++;
      addLedger(label, -amount);
      refreshCoinUI();
      sfxPay();   /* 花金币：下行付出音 */
      return true;
    }
    function grant(amount, label){
      if (W.test){ sfxGain(); return; }   /* 测试账号余额恒定、不增币；到账叮当照常响 */
      W.coins += amount;
      addLedger(label, amount);
      refreshCoinUI();
      sfxGain();   /* 金币到账 / 捡钱：上行叮当 */
    }

      const r = ROUTES[routeKey];
      if (!W.name){ toast(t("ui.needLogin")); window.scrollTo({top:0, behavior:"smooth"}); return; }
      const label = fmt(t("ui.ledgerTicket"), { route: t("routes."+routeKey+".name") });
      if (!charge(r.ticket || 0, label, false)) return;
      if (r.ticket && !W.test) toast(fmt(t("ui.ticketPaid"), {n: r.ticket}));
      newGame(routeKey);
      sfxArrive();   /* 到达城市：迎宾小旋律 */
      pendingWalk = { from: -1, route: routeKey };   // 开局：小人从入境口走进城市
      showMap();
    }

    /* ---------------- 游戏状态 ---------------- */
    let G = null;         // 当前一局
    let mgCleanup = null; // 小游戏计时器清理
    function newGame(routeKey){
      pendingWalk = null;
      const r = ROUTES[routeKey];
      G = {
        route: routeKey, cash: r.startCash, health: 80, happy: 70,
        age: r.startAge, year: 1, unlocked: 0, stars: {}, totalScore: 0,
        levelStart: null, mgScore: 0
      };
    }
    function clampStats(){
      G.health = Math.max(0, Math.min(100, G.health));
      G.happy  = Math.max(0, Math.min(100, G.happy));
    }
    function statusStage(){
      if (ROUTES[G.route].citizen) return 4;   // 出生在美国：天生公民
      const total = ROUTES[G.route].levels.length;
      const done = G.unlocked;
      if (done >= total) return 4;
      if (done >= total - 1) return 3;           // 绿卡关通过 ≈ 永久居民
      if (done >= Math.ceil(total/2)) return 2;
      if (done >= 1) return 1;
      return 0;
    }

    /* ---------------- 渲染 ---------------- */
    const app = document.getElementById("app");
    const $ = (sel, el)=> (el||document).querySelector(sel);

    function toast(msg){
      const el = $("#toast"); el.textContent = msg; el.classList.add("show");
      clearTimeout(el._t); el._t = setTimeout(()=> el.classList.remove("show"), 2400);
    }

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=";
    let AC = null, masterGain = null, bgmEl = null;
    function audioCtx(){
      if (!AC){
        const Ctor = window.AudioContext || window.webkitAudioContext;
        if (!Ctor) return null;
        try { AC = new Ctor(); } catch(e){ return null; }
        masterGain = AC.createGain(); masterGain.gain.value = 0.9; masterGain.connect(AC.destination);
      }
      if (AC.state === "suspended"){ try { const p = AC.resume(); if (p && p.catch) p.catch(()=>{}); } catch(e){} }
      return AC;
    }
    /* 每一次点按都调用（pointerdown + click 全局监听）：恢复被挂起的上下文 + 确保 BGM 在播。
       必须在用户手势的调用链内执行，iOS 才允许恢复/播放。 */
    function sndWake(){
      if (!SND_ON) return;
      audioCtx();
      startBGM();
    }
    function mtof(m){ return 440 * Math.pow(2, (m - 69) / 12); }
    function tone(midi, when, dur, type, vol, slideTo){
      if (!AC || !masterGain) return;
      const t0 = Math.max(when || 0, AC.currentTime);
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(mtof(midi), t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(mtof(slideTo), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(masterGain);
      o.start(t0); o.stop(t0 + dur + 0.05);
    }
    function bgmAudio(){
      if (!bgmEl){
        bgmEl = new Audio();
        bgmEl.src = BGM_SRC;
        bgmEl.loop = true;
        bgmEl.preload = "auto";
        bgmEl.volume = 0.6;
      }
      return bgmEl;
    }
    function startBGM(){
      if (!SND_ON) return;
      const el = bgmAudio();
      if (el.paused){ const p = el.play(); if (p && p.catch) p.catch(()=>{}); }
    }
    function stopBGM(){ if (bgmEl) bgmEl.pause(); }
    /* 运行时自检：ctx = AudioContext 状态；bgmPlaying = BGM 是否真在播放（以元素 paused 为准） */
    function sndState(){ return { ctx: AC ? AC.state : "none", bgmPlaying: !!(bgmEl && !bgmEl.paused && !bgmEl.ended) }; }
    function sfxReady(){ if (!SND_ON) return false; audioCtx(); return !!AC; }
    /* 点按：短促方波，一听就是"点了一下" */
    function sfxTick(){ if (!sfxReady()) return; tone(96, AC.currentTime, 0.06, "square", 0.16); }
    /* 打开面板 / 翻页：两音上行，像翻开一页 */
    function sfxPanel(){
      if (!sfxReady()) return; const t0 = AC.currentTime;
      tone(76, t0, 0.08, "triangle", 0.3); tone(84, t0 + 0.07, 0.11, "triangle", 0.3);
    }
    /* 做选择 / 确认：明亮单音"就它了" */
    function sfxSelect(){ if (!sfxReady()) return; tone(88, AC.currentTime, 0.12, "triangle", 0.34); }
    /* 花金币（付出）：三音下行，钱飞走的方向感 */
    function sfxPay(){
      if (!sfxReady()) return; const t0 = AC.currentTime;
      tone(84, t0, 0.09, "square", 0.26); tone(79, t0 + 0.08, 0.09, "square", 0.26); tone(72, t0 + 0.16, 0.16, "square", 0.26);
    }
    /* 金币到账 / 捡钱：金属双音上行叮当，与花钱方向相反、一听可辨 */
    function sfxGain(){
      if (!sfxReady()) return; const t0 = AC.currentTime;
      tone(88, t0, 0.1, "sine", 0.42); tone(95, t0 + 0.07, 0.34, "sine", 0.42); tone(100, t0 + 0.15, 0.22, "sine", 0.22);
    }
    /* 购买成功：到账叮当 + 确认小和弦 */
    function sfxBuyOK(){
      sfxGain();
      if (!sfxReady()) return; const t0 = AC.currentTime;
      tone(72, t0 + 0.28, 0.18, "triangle", 0.26); tone(76, t0 + 0.28, 0.18, "triangle", 0.2); tone(79, t0 + 0.28, 0.22, "triangle", 0.2);
    }
    /* 换装：布料感滑音 + 一声轻响 */
    function sfxOutfit(){
      if (!sfxReady()) return; const t0 = AC.currentTime;
      tone(64, t0, 0.14, "sine", 0.3, 79); tone(91, t0 + 0.13, 0.1, "triangle", 0.26);
    }
    /* 走路脚步：极轻的低敲，跟走路节奏走 */
    function sfxStep(){ if (!sfxReady()) return; tone(57, AC.currentTime, 0.05, "triangle", 0.13); }
    /* 到达门口 / 坐下：柔和落座双音 */
    function sfxSeat(){
      if (!sfxReady()) return; const t0 = AC.currentTime;
      tone(69, t0, 0.1, "sine", 0.3); tone(64, t0 + 0.09, 0.16, "sine", 0.28);
    }
    /* 文化气泡出现：小铃铛一闪 */
    function sfxBubble(){ if (!sfxReady()) return; tone(103, AC.currentTime, 0.16, "sine", 0.3); }
    /* 打开城市名片：翻卡三连音 */
    function sfxCard(){
      if (!sfxReady()) return; const t0 = AC.currentTime;
      tone(79, t0, 0.07, "triangle", 0.3); tone(84, t0 + 0.06, 0.07, "triangle", 0.3); tone(88, t0 + 0.12, 0.13, "triangle", 0.3);
    }
    /* 道具 / 食物 pop：弹跳上滑；食物再加欢快双音 */
    function sfxPop(food){
      if (!sfxReady()) return;
      const t0 = AC.currentTime;
      tone(52, t0, 0.14, "sine", 0.5, 76);
      if (food){ tone(60, t0 + 0.09, 0.14, "sine", 0.42, 84); tone(72, t0 + 0.18, 0.17, "triangle", 0.26); }
    }
    /* 过关：上扬小号式旋律 */
    function sfxWin(){
      if (!sfxReady()) return;
      const t0 = AC.currentTime, seq = [72, 76, 79, 84];
      seq.forEach((m, i)=> tone(m, t0 + i * 0.1, 0.17, "sawtooth", 0.2));
      tone(84, t0 + 0.42, 0.36, "sawtooth", 0.2); tone(88, t0 + 0.42, 0.32, "triangle", 0.16);
    }
    /* 到达新城市：迎宾小旋律 */
    function sfxArrive(){
      if (!sfxReady()) return;
      const t0 = AC.currentTime, seq = [72, 76, 79, 84, 79, 76];
      seq.forEach((m, i)=> tone(m, t0 + i * 0.1, 0.24, "triangle", 0.32));
    }
    /* 失败：温和下行，不打击玩家 */
    function sfxFail(){
      if (!sfxReady()) return;
      const t0 = AC.currentTime, seq = [72, 69, 65];
